<div id="toast"></div>
<script>
// ── GLOBAL HELPERS ───────────────────────────────────────
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}
window.escapeHtml = escapeHtml;

// ── STATE ───────────────────────────────────────────────
let TOKEN = localStorage.getItem('velo_token') || '';
let registry = {};
let dashData = {};
let activeModels = {};
let currentFallbacks = {};
let currentUser = localStorage.getItem('velo_user') || 'admin';
let currentUserRole = localStorage.getItem('velo_role') || 'admin';
let AUTO_MODE = localStorage.getItem('velo_auto') === '1';

// ── AUTH ────────────────────────────────────────────────
document.getElementById('login-form').onsubmit = async (e) => {
  e.preventDefault();
  const fd = new URLSearchParams();
  fd.append('username', document.getElementById('un').value);
  fd.append('password', document.getElementById('pw').value);
  const r = await fetch('/api/v1/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: fd });
  if (r.ok) {
    const d = await r.json();
    TOKEN = d.access_token;
    currentUserRole = d.role || 'admin';
    localStorage.setItem('velo_token', TOKEN);
    localStorage.setItem('velo_user', document.getElementById('un').value);
    localStorage.setItem('velo_role', currentUserRole);
    currentUser = document.getElementById('un').value;
    document.getElementById('user-label').textContent = currentUser;
    showApp();
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
};

function logout() {
  localStorage.removeItem('velo_token');
  localStorage.removeItem('velo_user');
  localStorage.removeItem('velo_role');
  TOKEN = '';
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-error').style.display = 'none';
}

async function apiFetch(url, opts = {}) {
  const r = await fetch(url, { ...opts, headers: { 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  if (r.status === 401) { logout(); return null; }
  return r;
}

// ── INIT ────────────────────────────────────────────────
if (TOKEN) showApp();

async function loadUserProfile() {
  try {
    const r = await apiFetch('/api/v1/me');
    if (r && r.ok) {
      const d = await r.json();
      currentUser = d.username || currentUser;
      currentUserRole = d.role || 'admin';
      const uLbl = document.getElementById('user-label');
      if (uLbl) uLbl.textContent = currentUser;
      const rBadge = document.getElementById('user-role-badge');
      if (rBadge) {
        rBadge.textContent = currentUserRole.toUpperCase();
        if (currentUserRole === 'viewer') {
          rBadge.style.background = 'rgba(245,158,11,0.2)';
          rBadge.style.color = '#fbbf24';
        } else {
          rBadge.style.background = 'rgba(0,212,255,0.18)';
          rBadge.style.color = 'var(--cyan)';
        }
      }
    }
  } catch (e) {}
}

async function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('user-label').textContent = currentUser;
  await Promise.all([loadUserProfile(), loadRegistry(), refreshDashboard(), loadConsoleModels(), checkDetectedEnvProviders(), loadPrivacyStatus()]);
  // Wire Auto-mode checkbox
  const autoChk = document.getElementById('c-auto');
  if (autoChk) {
    autoChk.checked = AUTO_MODE;
    autoChk.onchange = () => {
      AUTO_MODE = autoChk.checked;
      localStorage.setItem('velo_auto', AUTO_MODE ? '1' : '0');
    };
  }
}

// ── PAGES ────────────────────────────────────────────────
function setActiveNav(name) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.id === `nav-${name}`));
}

function switchPage(name) {
  const btn = document.getElementById('nav-' + name);
  showPage(name, btn);
}

function showPage(name, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const targetPage = document.getElementById('page-' + name);
  if (targetPage) targetPage.classList.add('active');
  const navBtn = btn || document.getElementById('nav-' + name);
  if (navBtn) navBtn.classList.add('active');
  if (name === 'routing') {
    loadRouting();
    loadTransforms();
    loadLatencyMatrix();
    loadCircuitBreakerStatus();
    if (typeof loadShadowConfig === 'function') loadShadowConfig();
    if (typeof loadRouterTopology === 'function') loadRouterTopology();
  }
  if (name === 'registry') loadRegistry();
  if (name === 'groups') loadGroups();
  if (name === 'keys') loadGatewayKeys();
  if (name === 'console') loadConsoleModels();
  if (name === 'analytics') {
    loadAnalytics();
    if (typeof loadRequestTraces === 'function') loadRequestTraces();
    if (typeof loadWebhookCenter === 'function') loadWebhookCenter();
  }
  if (name === 'guardrails') {
    loadGuardrails();
    loadPrivacyStatus();
  }
  if (name === 'cache') loadCacheStats();
  if (name === 'prompts') loadPrompts();
  if (name === 'mcp') {
    loadMCPTools();
    loadMCPPolicy();
    if (typeof runMcpSecurityAudit === 'function') runMcpSecurityAudit(true);
  }
}

// ── DASHBOARD ────────────────────────────────────────────

async function refreshDashboard() {
  const [r, sys_r, proxy_r] = await Promise.all([
    apiFetch('/api/v1/dashboard'),
    apiFetch('/api/v1/system'),
    apiFetch('/api/v1/proxy')
  ]);
  if (!r) return;
  dashData = await r.json();
  const sysData = sys_r ? await sys_r.json() : {};
  const proxyData = proxy_r ? await proxy_r.json() : {};

  document.getElementById('s-providers').textContent = dashData.total_providers;
  document.getElementById('s-keys').textContent = dashData.total_active_keys;
  if (document.getElementById('s-tripped-keys')) {
    const trips = dashData.total_tripped_keys || 0;
    const el = document.getElementById('s-tripped-keys');
    el.textContent = trips;
    el.style.color = trips > 0 ? '#ef4444' : '#10b981';
  }
  document.getElementById('s-routes').textContent = Object.keys(dashData.fallbacks || {}).length;
  document.getElementById('s-strategy').textContent = (dashData.strategy || 'priority').replace(/_/g,' ').toUpperCase();
  
  if (document.getElementById('s-storage')) {
    let st = sysData.storage || 'Memory (RAM)';
    if (st === 'StorageManager' || st.includes('SQL') || st.includes('SQLite') || st.includes('Disk')) {
      st = 'SQLite (Disk)';
    } else if (st === 'MemoryStorage' || st.includes('Memory') || st.includes('RAM')) {
      st = 'Memory (RAM)';
    } else {
      st = st.replace(/Storage(Manager)?$/, '');
    }
    const el = document.getElementById('s-storage');
    el.textContent = st;
    el.title = sysData.storage || st;
  }

  if (document.getElementById('s-groups') && dashData.total_groups !== undefined) {
    document.getElementById('s-groups').textContent = dashData.total_groups;
  }

  if (document.getElementById('s-cache-hit-rate')) {
    const isCacheActive = sysData.semantic_cache !== false;
    document.getElementById('s-cache-hit-rate').textContent = isCacheActive ? 'Active' : 'Disabled';
    document.getElementById('s-cache-hit-rate').style.color = isCacheActive ? '#a78bfa' : 'var(--muted)';
  }

  document.getElementById('providers-count').textContent = dashData.total_providers;

  // Set proxy URL and status text
  const proxyUrl = proxyData.proxy || '';
  const proxyInput = document.getElementById('proxy-url-input');
  const proxyStatus = document.getElementById('proxy-status-message');
  if (proxyInput) proxyInput.value = proxyUrl;
  if (proxyStatus) {
    if (proxyUrl) {
      proxyStatus.innerHTML = `🟢 Egress proxy is <span style="color:var(--cyan); font-weight:600;">ACTIVE</span>: <code>${proxyUrl}</code>`;
    } else {
      proxyStatus.innerHTML = `⚪ Egress proxy is <span style="color:var(--muted); font-weight:600;">DISABLED</span>. Outgoing requests connect directly.`;
    }
  }

  currentFallbacks = dashData.fallbacks || {};
  renderProviders(dashData.providers || []);
  await loadGroups();
}

function renderProviders(providers) {
  const grid = document.getElementById('providers-grid');
  if (!providers.length) {
    grid.innerHTML = `<div class="empty-state"><div class="empty-icon">🏜️</div><div>No providers loaded.</div><div style="font-size:0.8rem;margin-top:8px;color:var(--muted)">Add <code style="color:var(--cyan)">PROVIDER_API_KEYS=...</code> to your .env or click Add Provider</div></div>`;
    return;
  }
  grid.innerHTML = providers.map(p => {
    const { total, active, invalid, rate_limited } = p.keys;
    const badge = active === 0 ? 'badge-error' : (invalid > 0 || rate_limited > 0) ? 'badge-warning' : 'badge-active';
    const badgeTxt = active === 0 ? 'No Active Keys' : `${active}/${total} Active`;
    const cState = (p.circuit_state || 'closed').toLowerCase();
    let circuitBadge = '';
    if (cState === 'open' || cState === 'tripped') {
      circuitBadge = `<span class="provider-badge" style="background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4);" title="Circuit Breaker TRIPPED: All keys in cooldown">🔴 Tripped</span>`;
    } else if (cState === 'half_open') {
      circuitBadge = `<span class="provider-badge" style="background: rgba(234, 179, 8, 0.2); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.4);" title="Circuit Breaker Half-Open: Probing health">🟡 Probing</span>`;
    } else {
      circuitBadge = `<span class="provider-badge" style="background: rgba(34, 197, 94, 0.12); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.25);" title="Circuit Breaker Closed: Healthy">🟢 Healthy</span>`;
    }
    const keyPills = (p.key_stats || []).map(k => {
      const cls = k.status === 'active' ? 'active' : k.status === 'rate_limited' ? 'rate' : 'invalid';
      return `<div class="key-pill ${cls}">⬤ ${k.hint} <span class="key-del" title="Delete key" onclick="deleteSingleKey(\'${p.name.toLowerCase()}\',\'${k.hint}\',event)">&times;</span></div>`;
    }).join('');
    const latencyStr = p.latency_ms ? `⚡ ${p.latency_ms}ms` : '—';
    return `
    <div class="provider-card">
      <div class="provider-header">
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
          <div class="provider-name">${p.name}</div>
          ${p.name.toLowerCase() === 'mock' ? `<span class="provider-badge" style="background: rgba(0, 255, 157, 0.15); color: var(--green); border: 1px solid rgba(0,255,157,0.3); font-size: 0.68rem; padding: 2px 6px;">🧪 Zero-Cost Simulator</span>` : ''}
          ${p.custom_models && p.custom_models.length ? `<span class="provider-badge" style="background: rgba(124, 111, 255, 0.2); color: var(--primary); border: 1px solid rgba(124,111,255,0.3); font-size: 0.68rem; padding: 2px 6px;" title="Configured models: ${p.custom_models.join(', ')}">🎯 ${p.custom_models.length} Custom Models</span>` : ''}
        </div>
        <div style="display: flex; gap: 6px; align-items: center;">${circuitBadge}<div class="provider-badge ${badge}">${badgeTxt}</div></div>
      </div>
      <div class="provider-url" style="margin-bottom:6px;">${p.base_url}</div>
      <div style="margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 6px; background: rgba(0,212,255,0.06); border: 1px solid rgba(0,212,255,0.22); border-radius: 8px; padding: 5px 10px;">
        <div style="display:flex; align-items:center; gap:6px; min-width:0;">
          <span style="font-size:0.68rem; font-weight:700; color:var(--cyan); text-transform:uppercase; letter-spacing:0.5px;">Cursor / OpenCode:</span>
          <code style="font-family: var(--mono); font-size: 0.76rem; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">/p/${p.name.toLowerCase()}/v1</code>
        </div>
        <button type="button" class="btn btn-sm btn-ghost" style="padding: 2px 8px; font-size: 0.72rem; color: var(--cyan); border: 1px solid rgba(0,212,255,0.35); background: rgba(0,212,255,0.08); flex-shrink:0;" onclick="copyProviderUrl('${p.name.toLowerCase()}', event)" title="1-Click Copy dedicated Base URL for this provider">📋 Copy URL</button>
      </div>
      <div class="provider-meta">
        <div class="meta-item"><div class="meta-label">Keys</div><div class="meta-value">${total}</div></div>
        <div class="meta-item"><div class="meta-label">Latency</div><div class="meta-value" id="latency-val-${p.name.toLowerCase()}" style="font-size:0.9rem">${latencyStr}</div></div>
      </div>
      <div class="key-pills">${keyPills || '<span style="font-size:0.75rem;color:var(--muted)">No key details</span>'}</div>
      <div class="divider"></div>
      <div class="provider-actions">
        ${active < total ? `<button class="btn btn-sm btn-ghost" style="color:var(--yellow); border:1px solid rgba(255,214,10,0.3)" onclick="resetProviderCircuit('${p.name.toLowerCase()}', this)" title="Reset tripped, exhausted or cooldown keys back to Active">🔄 Reset</button>` : ''}
        <button class="btn btn-sm btn-ghost" onclick="showModels('${p.name.toLowerCase()}')">📋 Models</button>
        <button class="btn btn-sm btn-ghost" id="ping-btn-${p.name.toLowerCase()}" onclick="pingSingleProvider('${p.name.toLowerCase()}', this)" title="Probe provider latency & health">⚡ Ping</button>
        <button class="btn btn-sm btn-ghost" onclick="openKeysModal('${p.name.toLowerCase()}')">🔑 Add Key</button>
        <button class="btn btn-sm btn-ghost" onclick="openEditProviderModal('${p.name.toLowerCase()}', '${p.base_url || ""}')" title="Edit Provider">✏️ Edit</button>
        <button class="btn btn-sm btn-ghost" style="color:#ef4444" onclick="deleteProvider('${p.name.toLowerCase()}')" title="Delete Provider">🗑️ Delete</button>
        <button class="btn btn-sm btn-ghost" style="margin-left:auto" onclick="useInConsole('${p.name.toLowerCase()}')">▶ Test</button>
      </div>
    </div>`;
  }).join('');
}

// ── REGISTRY ────────────────────────────────────────────
const CATEGORIES = {
  'Frontier / Cloud': ['OPENAI','AZURE','ANTHROPIC','GOOGLE','VERTEXAI','AWS_BEDROCK'],
  'Fast Inference': ['GROQ','TOGETHER','FIREWORKS','ANYSCALE','PERPLEXITY','OPENROUTER','DEEPINFRA','FEATHERLESS','NOVITA','CHUTES','NSCALE','NEBIUS','HYPERBOLIC','LAMBDA','SAMBANOVA','CEREBRAS','FRIENDLIAI','GALADRIEL','GMI','PUBLICAI','COMETAPI','AIML'],
  'Chinese / Asia': ['DEEPSEEK','QWEN','DASHSCOPE','MOONSHOT','MINIMAX','ZHIPU','BAIDU','VOLCANO','XIAOMI','ZAI'],
  'Specialized': ['MISTRAL','CODESTRAL','COHERE','AI21','NLP_CLOUD','ALEPH_ALPHA','PREDIBASE','CLARIFAI','HUGGINGFACE','GRADIENT'],
  'Local / Self-Hosted': ['OLLAMA','LM_STUDIO','VLLM','LLAMAFILE','TRITON','XINFERENCE','DOCKER_MODEL'],
  'Enterprise': ['DATABRICKS','SAGEMAKER','SNOWFLAKE','WATSONX','SAP','OCI','CLOUDFLARE','HEROKU','OVH','SCALEWAY','DATAROBOT','NVIDIA','NVIDIA_NIM'],
  'Dev / Other': ['GITHUB','VERCEL','XAI','BASETEN','REPLICATE','STABILITY','FAL','RECRAFT','RUNWAYML','BLACK_FOREST'],
};

function getCategoryFor(key) {
  for (const [cat, keys] of Object.entries(CATEGORIES)) {
    if (keys.includes(key)) return cat;
  }
  return 'Other';
}

let filteredRegistry = [];
let activeCategory = 'All';

async function loadRegistry() {
  const r = await apiFetch('/api/v1/registry');
  if (!r) return;
  registry = await r.json();
  filteredRegistry = Object.entries(registry);
  document.getElementById('registry-count').textContent = filteredRegistry.length;

  // Build category filters
  const cats = ['All', ...Object.keys(CATEGORIES), 'Other'];
  document.getElementById('cat-filters').innerHTML = cats.map(c =>
    `<button class="cat-btn${c==='All'?' active':''}" onclick="setCat('${c}',this)">${c}</button>`
  ).join('');

  // Populate add-modal select
  const sel = document.getElementById('add-provider-select');
  sel.innerHTML = '<option value="">— Pick from registry or custom —</option>' +
    Object.entries(registry).map(([k,v]) => `<option value="${k}" data-url="${v}">${k} — ${v}</option>`).join('');

  renderRegistry();
}

function setCat(cat, btn) {
  activeCategory = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterRegistry();
}

function filterRegistry() {
  const q = document.getElementById('reg-search').value.toLowerCase();
  filteredRegistry = Object.entries(registry).filter(([k,v]) => {
    const matchCat = activeCategory === 'All' || getCategoryFor(k) === activeCategory;
    const matchQ = !q || k.toLowerCase().includes(q) || v.toLowerCase().includes(q);
    return matchCat && matchQ;
  });
  document.getElementById('registry-count').textContent = filteredRegistry.length;
  renderRegistry();
}

function renderRegistry() {
  const loaded = new Set((dashData.providers || []).map(p => p.name));
  const tbody = document.getElementById('registry-tbody');
  tbody.innerHTML = filteredRegistry.map(([k, url]) => {
    const isLoaded = loaded.has(k.toLowerCase());
    return `<tr>
      <td><span style="font-weight:600">${k}</span>${isLoaded ? ' <span class="provider-badge badge-active" style="font-size:0.65rem;padding:1px 6px">loaded</span>' : ''}</td>
      <td><code style="font-family:var(--mono);color:var(--yellow);font-size:0.78rem">${k}_API_KEYS</code></td>
      <td><span class="mono">${url}</span></td>
      <td style="color:var(--muted);font-size:0.78rem">${getCategoryFor(k)}</td>
      <td>
        ${isLoaded
          ? `<div style="display:flex;gap:4px">
               <button class="btn btn-sm btn-ghost" onclick="showModels('${k.toLowerCase()}')">Models</button>
               <button class="btn btn-sm btn-ghost" onclick="openEditProviderModal('${k.toLowerCase()}', '${url}')" title="Edit Provider">✏️</button>
               <button class="btn btn-sm btn-ghost" style="color:#ef4444" onclick="deleteProvider('${k.toLowerCase()}')" title="Delete Provider">🗑️</button>
             </div>`
          : `<button class="btn btn-sm btn-cyan" onclick="quickAdd('${k}','${url}')">+ Add</button>`
        }
      </td>
    </tr>`;
  }).join('') || '<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--muted)">No results</td></tr>';
}

function exportRegistry() {
  const blob = new Blob([JSON.stringify(registry, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'veloroute-registry.json'; a.click();
  toast('Registry exported!', 'success');
}

// ── ROUTING ───────────────────────────────────────────────
async function loadRouting() {
  const r = await apiFetch('/api/v1/router');
  if (!r) return;
  const data = await r.json();
  currentFallbacks = data.fallbacks || {};

  // Strategy
  document.querySelectorAll('.strat-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.v === data.strategy);
  });

  // Load Model Aliases
  await loadAliases();

  // Load Canary Routing Settings
  await loadCanaryConfig();

  // Fallbacks
  const fc = document.getElementById('fallback-container');
  const fkeys = Object.keys(currentFallbacks);
  fc.innerHTML = fkeys.length ? fkeys.map(primary => {
    const tos = currentFallbacks[primary];
    return `<div class="fallback-rule" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
      <div style="display:flex; align-items:center; flex-wrap:wrap; gap:8px;">
        <span class="fallback-from" style="font-weight:600;">📌 ${primary}</span>
        <span class="fallback-arrow">&rarr;</span>
        <span class="fallback-to" style="color:var(--muted2); font-family:var(--mono); font-size:0.82rem; display:flex; align-items:center; flex-wrap:wrap; gap:6px;">
          ${tos.map(m => `<span style="background:rgba(255,255,255,0.06); padding:2px 8px; border-radius:6px; border:1px solid var(--border);">${m}</span>`).join('<span class="fallback-arrow" style="margin:0 4px;">&rarr;</span>')}
        </span>
      </div>
      <div style="display:flex; gap:6px; margin-left:auto;">
        <button class="btn btn-sm btn-ghost" onclick="editFallback('${primary}', ${JSON.stringify(tos).replace(/"/g, '&quot;')})">Edit</button>
        <button class="btn btn-sm btn-danger" onclick="removeFallback('${primary}')">✕</button>
      </div>
    </div>`;
  }).join('') : `<div style="color:var(--muted);font-size:0.85rem">No fallback rules configured. Add one above.</div>`;

  // Latencies
  const latencies = data.latencies || {};
  const lc = document.getElementById('latency-container');
  if (lc) {
    const lat = Object.entries(latencies);
    lc.innerHTML = lat.length ? lat.sort((a,b) => a[1]-b[1]).map(([p, ms]) => {
      const pct = Math.min(100, (ms / 2000) * 100);
      const color = ms < 300 ? 'var(--green)' : ms < 800 ? 'var(--yellow)' : 'var(--red)';
      return `<div style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:0.85rem">
          <span>${p}</span><span style="color:${color};font-family:var(--mono)">${ms.toFixed(0)}ms</span>
        </div>
        <div class="latency-bar-wrap"><div class="latency-bar" style="width:${pct}%;background:${color}"></div></div>
      </div>`;
    }).join('') : `<div style="color:var(--muted);font-size:0.85rem">No latency data yet. Run some requests via the Test Console.</div>`;
  }
}

// ── MODEL ALIASES ─────────────────────────────────────────
async function loadAliases() {
  const ac = document.getElementById('aliases-container');
  if (!ac) return;
  const r = await apiFetch('/api/v1/router/aliases');
  if (!r) return;
  const data = await r.json();
  const aliases = data.aliases || {};
  const keys = Object.keys(aliases);
  ac.innerHTML = keys.length ? keys.map(aliasName => {
    const target = aliases[aliasName];
    return `<div class="fallback-rule alias-row" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
      <div style="display:flex; align-items:center; flex-wrap:wrap; gap:8px;">
        <span class="alias-name" style="font-weight:600; color:var(--cyan); font-family:var(--mono);">🏷️ ${aliasName}</span>
        <span class="fallback-arrow">&rarr;</span>
        <span class="alias-target" style="color:var(--text); font-family:var(--mono); font-size:0.82rem; background:rgba(255,255,255,0.06); padding:2px 8px; border-radius:6px; border:1px solid var(--border);">
          ${target}
        </span>
      </div>
      <div style="display:flex; gap:6px; margin-left:auto;">
        <button class="btn btn-sm btn-danger" onclick="deleteAlias('${aliasName}')">✕</button>
      </div>
    </div>`;
  }).join('') : '<div style="color:var(--muted);font-size:0.85rem">No virtual model aliases configured. Click + Add Alias to route virtual model names.</div>';
}

function openAliasModal() {
  document.getElementById('alias-name').value = '';
  document.getElementById('alias-target').value = '';

let _activeStreamAbortController = null;

function stopStream() {
  if (_activeStreamAbortController) {
    _activeStreamAbortController.abort();
    _activeStreamAbortController = null;
    toast('Stream aborted by client.', 'info');
    const stopBtn = document.getElementById('stop-stream-btn');
    if (stopBtn) stopBtn.style.display = 'none';
  }
}

async function testStream() {
  const group = document.getElementById('c-group') ? document.getElementById('c-group').value.trim() : '';
  const model = group || document.getElementById('c-model').value.trim();
  const prompt = document.getElementById('c-prompt').value.trim();
  if (!model || !prompt) { toast('Enter model and prompt', 'error'); return; }
  const retries = document.getElementById('c-retries').value || 2;
  const delay = document.getElementById('c-delay').value || 1.0;
  const out = document.getElementById('console-output');
  out.textContent = '📡 Connecting live stream...\n';
  const metaEl = document.getElementById('output-meta');
  metaEl.innerHTML = '<span class="output-tag" style="background:rgba(0,212,255,0.15); color:var(--cyan); border:1px solid rgba(0,212,255,0.3)">📡 Streaming...</span>';

  const stopBtn = document.getElementById('stop-stream-btn');
  if (stopBtn) stopBtn.style.display = 'block';

  _activeStreamAbortController = new AbortController();
  const startTime = performance.now();
  let firstTokenTime = null;
  let chunkCount = 0;
  let estimatedTokens = 0;

  try {
    const url = `/api/v1/stream?model=${encodeURIComponent(model)}&prompt=${encodeURIComponent(prompt)}&max_retries=${retries}&retry_delay=${delay}`;
    const resp = await fetch(url, {
      headers: { 'Authorization': `Bearer ${TOKEN}` },
      signal: _activeStreamAbortController.signal,
    });

    if (!resp.ok) {
      const errText = await resp.text();
      out.textContent = `[Stream Error ${resp.status}]: ${errText}`;
      toast(`Stream failed: ${resp.status}`, 'error');
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    out.textContent = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      if (!firstTokenTime) {
        firstTokenTime = performance.now();
      }

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const chunk = line.slice(6);
          if (chunk === '[DONE]') {
            toast('Stream complete!', 'success');
            break;
          }
          if (chunk.startsWith('[ERROR]')) {
            out.textContent += '\n' + chunk;
            toast(chunk, 'error');
            break;
          }
          out.textContent += chunk;
          out.scrollTop = out.scrollHeight;
          chunkCount++;
          // Approximate tokens ~ word counts
          estimatedTokens += Math.max(1, Math.round(chunk.trim().split(/\s+/).length * 1.3));

          // Live speedometer HUD
          const elapsedSec = (performance.now() - firstTokenTime) / 1000.0;
          const tps = elapsedSec > 0.05 ? (estimatedTokens / elapsedSec).toFixed(1) : '—';
          const ttftMs = Math.round(firstTokenTime - startTime);

          metaEl.innerHTML = `
            <span class="output-tag provider">${escapeHtml(model)}</span>
            <span class="output-tag" style="background:rgba(0,255,157,0.15); color:var(--green); border:1px solid rgba(0,255,157,0.3)">⚡ TTFT: ${ttftMs}ms</span>
            <span class="output-tag" style="background:rgba(0,212,255,0.15); color:var(--cyan); border:1px solid rgba(0,212,255,0.3)">🚀 Speed: ${tps} tok/s</span>
            <span class="output-tag tokens">📊 ~${estimatedTokens} tokens</span>
          `;
        }
      }
    }
  } catch (err) {
    if (err.name === 'AbortError') {
      out.textContent += '\n\n[STREAM ABORTED BY USER]';
    } else {
      out.textContent += `\n[Stream Exception]: ${err.message}`;
      toast(`Stream error: ${err.message}`, 'error');
    }
  } finally {
    if (stopBtn) stopBtn.style.display = 'none';
    _activeStreamAbortController = null;
  }
}

function copyToClipboard(text, successMsg) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      if (successMsg) toast(successMsg, 'success');
    }).catch(() => {
      _fallbackCopy(text, successMsg);
    });
  } else {
    _fallbackCopy(text, successMsg);
  }
}

function _fallbackCopy(text, successMsg) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    ta.style.top = '-9999px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const successful = document.execCommand('copy');
    document.body.removeChild(ta);
    if (successful) {
      if (successMsg) toast(successMsg, 'success');
      return;
    }
  } catch (err) {}
  prompt('Copy to clipboard (Ctrl+C, Enter):', text);
}

function copyProviderUrl(providerName, event) {

  const origin = window.location.origin && window.location.origin !== 'null' ? window.location.origin : 'http://127.0.0.1:8000';
  const url = `${origin}/p/${providerName.toLowerCase()}/v1`;
  copyToClipboard(url, `Provider Base URL copied: ${url}`);
}

    };
    const r = await apiFetch('/api/v1/providers/sync_models', {
      method: 'POST',
      body: JSON.stringify(payload),
    });
    if (!r || !r.ok) {
      const err = r ? await r.json().catch(() => ({})) : {};
      statusEl.innerHTML = `<span style="color:#ef4444">❌ Sync failed: ${err.detail || 'Could not connect to provider'}</span>`;
      return;
    }
    const data = await r.json();
    if (!data.models || !data.models.length) {
      statusEl.innerHTML = `<span style="color:var(--yellow)">⚠️ Found 0 ${filterType} models (total discovered: ${data.total_discovered || 0})</span>`;
      return;
    }
    textareaEl.value = data.models.join(', ');
    statusEl.innerHTML = `<span style="color:var(--green)">✅ Synced ${data.count} ${filterType} model(s) (out of ${data.total_discovered} total)</span>`;
    toast(`Synced ${data.count} ${filterType} model(s)!`, 'success');
  } catch (err) {
    statusEl.innerHTML = `<span style="color:#ef4444">❌ Error: ${err.message}</span>`;
  }
}

    container.innerHTML = '<div style="font-size:0.8rem; color:var(--muted)">Could not load keys</div>';

  const data = await r.json();

  if (!stats.length) {

  }
  container.innerHTML = stats.map(k => {

async function deleteSingleKey(provider, keyHint, event) {
  if (event) {

  }
  if (!confirm(`Are you sure you want to delete key ${keyHint} from ${provider}?`)) return;
  const r = await apiFetch(`/api/v1/providers/${encodeURIComponent(provider)}/keys?key=${encodeURIComponent(keyHint)}`, {
    method: 'DELETE'
  });
  if (r && r.ok) {
    toast(`Key ${keyHint} removed from ${provider}`, 'info');
    refreshDashboard();
    if (document.getElementById('keys-modal').classList.contains('open')) {
      await loadExistingKeysForModal(provider, 'keys-modal-existing');
    }
    if (document.getElementById('edit-provider-modal').classList.contains('open')) {
      await loadExistingKeysForModal(provider, 'edit-provider-current-keys');
    }
  } else {
    toast(`Failed to delete key ${keyHint}`, 'error');
  }
}

async function loadActiveModelsDetails() {
  const tbody = document.getElementById('active-models-tbody');
  tbody.innerHTML = '<tr><td colspan="5"><div class="loading-row"><div class="spinner"></div> Loading active model features...</div></td></tr>';
  
  const r = await apiFetch('/api/v1/active_models_details');
  if (!r) return;

  document.getElementById('registry-count').textContent = data.length;
  
  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--muted)">No active models running. Configure providers with API keys to activate models.</td></tr>';
    return;
  }
  
  tbody.innerHTML = data.map(m => {
    const caps = m.features.map(f => {
      let color = 'var(--muted)';
      if (f === 'Vision') color = 'linear-gradient(135deg, #ec4899, #f43f5e)';
      else if (f === 'Tool Use') color = 'linear-gradient(135deg, #8b5cf6, #6366f1)';
      else if (f === 'Chat') color = 'linear-gradient(135deg, #10b981, #059669)';
      else if (f === 'Streaming') color = 'linear-gradient(135deg, #0ea5e9, #2563eb)';

    }).join('');
    
    const priceStr = (m.input_price !== null && m.output_price !== null) 
      ? `<span style="font-family:var(--mono); color:var(--cyan);">$${m.input_price.toFixed(2)}</span> / <span style="font-family:var(--mono); color:var(--primary);">$${m.output_price.toFixed(2)}</span>`
      : '<span style="color:var(--muted)">Unknown</span>';
      
    const contextStr = m.context_window 
      ? `<span style="font-family:var(--mono); font-weight:600;">${m.context_window.toLocaleString()} tokens</span>`
      : '—';
      
    return `<tr>
      <td style="font-weight:600; color:var(--text);">${m.model}</td>
      <td><span class="provider-badge badge-active" style="text-transform:uppercase;">${m.provider}</span></td>
      <td>${contextStr}</td>
      <td>${priceStr}</td>
      <td>${caps}</td>
    </tr>`;
  }).join('');
}

// ─── PREMIUM PERFORMANCE & USAGE ANALYTICS ─────────────────────────────────────
async function loadAnalytics() {
  const r = await apiFetch('/api/v1/analytics/data');
  if (!r) return;
  const data = await r.json();
  
  const summary = data.summary || { total_requests: 0 };
  const providers = data.by_provider || [];
  const models = data.by_model || [];
  const timeseries = data.timeseries || [];
  const errors = data.top_errors || [];
  
  // 1. Summary Cards
  document.getElementById('an-total-reqs').textContent = summary.total_requests || 0;
  document.getElementById('an-avg-latency').textContent = summary.avg_latency_ms ? `${summary.avg_latency_ms.toFixed(0)}ms` : '—';
  document.getElementById('an-total-tokens').textContent = summary.total_tokens ? summary.total_tokens.toLocaleString() : 0;
  
  const successRate = summary.total_requests ? ((1 - (summary.error_rate || 0)) * 100).toFixed(1) : '100';
  document.getElementById('an-success-rate').textContent = `${successRate}%`;
  
  const fallbackRate = summary.total_requests ? ((summary.fallback_rate || 0) * 100).toFixed(1) : '0';
  document.getElementById('an-fallback-rate').textContent = `${fallbackRate}%`;
  
  document.getElementById('an-min-latency').textContent = summary.min_latency_ms ? `${summary.min_latency_ms.toFixed(0)}ms` : '—';
  document.getElementById('an-max-latency').textContent = summary.max_latency_ms ? `${summary.max_latency_ms.toFixed(0)}ms` : '—';
  
  // 2. Providers Load Graph
  const provContainer = document.getElementById('an-providers-container');
  if (providers.length) {
    const maxReqs = Math.max(...providers.map(p => p.requests));
    provContainer.innerHTML = providers.map(p => {
      const pct = (p.requests / maxReqs) * 100;
      return `<div>
        <div style="display:flex; justify-content:space-between; margin-bottom:4px; font-size:0.83rem;">
          <span style="font-weight:600; text-transform:uppercase;">🏢 ${p.provider}</span>
          <span style="color:var(--muted2); font-family:var(--mono); font-size:0.78rem;">${p.requests} reqs · avg ${p.avg_latency_ms.toFixed(0)}ms</span>
        </div>
        <div class="latency-bar-wrap"><div class="latency-bar" style="width:${pct}%; background:linear-gradient(90deg, var(--primary), var(--cyan));"></div></div>
      </div>`;
    }).join('');
  } else {
    provContainer.innerHTML = '<div style="color: var(--muted); font-size: 0.85rem;">No provider stats available yet.</div>';
  }
  
  // 3. Models Load Graph
  const modContainer = document.getElementById('an-models-container');
  if (models.length) {
    const maxReqs = Math.max(...models.map(m => m.requests));
    modContainer.innerHTML = models.map(m => {
      const pct = (m.requests / maxReqs) * 100;
      return `<div>
        <div style="display:flex; justify-content:space-between; margin-bottom:4px; font-size:0.83rem;">
          <span style="font-weight:600; color:var(--cyan); font-family:var(--mono);">${m.model}</span>
          <span style="color:var(--muted2); font-family:var(--mono); font-size:0.78rem;">${m.requests} reqs · avg ${m.avg_latency_ms.toFixed(0)}ms</span>
        </div>
        <div class="latency-bar-wrap"><div class="latency-bar" style="width:${pct}%; background:linear-gradient(90deg, var(--cyan), var(--green));"></div></div>
      </div>`;
    }).join('');
  } else {
    modContainer.innerHTML = '<div style="color: var(--muted); font-size: 0.85rem;">No model stats available yet.</div>';
  }
  
  // 4. Timeline
  const timelineContainer = document.getElementById('an-timeline-container');
  if (timeseries.length) {
    const maxReqs = Math.max(...timeseries.map(t => t.requests));
    timelineContainer.innerHTML = timeseries.map(t => {
      const height = Math.max(15, (t.requests / maxReqs) * 100);
      const timeLabel = t.bucket.split('T')[1] || t.bucket;
      return `<div style="display:flex; flex-direction:column; align-items:center; flex:1; min-width:45px; height:100%; justify-content:flex-end;">
        <div style="color:var(--green); font-size:0.7rem; font-family:var(--mono); font-weight:600; margin-bottom:4px;">${t.requests}</div>
        <div style="width:20px; height:${height}px; background:linear-gradient(180deg, var(--green), var(--primary)); border-radius:3px 3px 0 0;" title="${t.requests} requests, ${t.tokens} tokens"></div>
        <div style="color:var(--muted); font-size:0.65rem; margin-top:6px; font-family:var(--mono);">${timeLabel}</div>
      </div>`;
    }).join('');
  } else {
    timelineContainer.innerHTML = '<div style="width:100%; text-align:center; color:var(--muted); font-size:0.85rem; align-self:center;">No hourly events captured yet.</div>';
  }
  
  // 5. System Error Signatures
  const errContainer = document.getElementById('an-errors-container');
  if (errors.length) {
    errContainer.innerHTML = errors.map(e => `
      <div style="background:rgba(255,59,92,0.04); border:1px solid rgba(255,59,92,0.15); border-radius:10px; padding:10px 14px; display:flex; align-items:center; justify-content:space-between; gap:12px;">
        <div style="font-family:var(--mono); font-size:0.8rem; color:var(--red); word-break:break-all;">${e.error}</div>
        <div style="display:flex; align-items:center; gap:8px; flex-shrink:0;">
          <span class="provider-badge badge-error" style="text-transform:uppercase;">${e.provider}</span>
          <span style="background:var(--red); color:white; font-size:0.75rem; font-weight:700; padding:2px 8px; border-radius:10px;">${e.count}x</span>
        </div>
      </div>
    `).join('');
  } else {
    errContainer.innerHTML = '<div style="color: var(--green); font-size: 0.85rem; font-weight:500;">✓ No errors recorded! System is fully healthy.</div>';
  }

  // 6. Key Usage Analytics & Circuit Breaker Health
  await loadKeyAnalytics();
}

async function loadKeyAnalytics() {
  const tbody = document.getElementById('an-keys-tbody');
  if (!tbody) return;
  const r = await apiFetch('/api/v1/analytics/keys');
  if (!r) return;
  const data = await r.json();
  const keys = data.keys || [];
  if (!keys.length) {
    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; padding:16px; color:var(--muted);">No key usage data recorded yet.</td></tr>';
    return;
  }
  tbody.innerHTML = keys.map(k => {
    let stateBadge = '<span class="provider-badge badge-active" style="font-size:0.7rem; padding:2px 8px;">Closed (Healthy)</span>';
    if (k.circuit_state === 'open') {
      stateBadge = '<span class="provider-badge badge-error" style="font-size:0.7rem; padding:2px 8px;">Open (Tripped)</span>';
    } else if (k.circuit_state === 'half_open') {
      stateBadge = '<span class="provider-badge badge-warning" style="font-size:0.7rem; padding:2px 8px;">Half-Open (Testing)</span>';
    }
    const statusCls = k.status === 'active' ? 'var(--green)' : k.status === 'circuit_broken' ? 'var(--red)' : 'var(--yellow)';
    const lastUsedStr = k.last_used > 0 ? new Date(k.last_used * 1000).toLocaleTimeString() : 'Never';
    return `<tr style="border-bottom: 1px solid rgba(255,255,255,0.05);">
      <td style="padding: 8px 10px; font-weight:600; text-transform:uppercase;">${k.provider}</td>
      <td style="padding: 8px 10px; font-family:var(--mono); color:var(--muted2);">${k.hint}</td>
      <td style="padding: 8px 10px; color:${statusCls}; font-weight:600;">${k.status}</td>
      <td style="padding: 8px 10px;">${stateBadge}</td>
      <td style="padding: 8px 10px; font-family:var(--mono);">${k.circuit_trips}</td>
      <td style="padding: 8px 10px; font-family:var(--mono);">${k.total_requests}</td>
      <td style="padding: 8px 10px; font-family:var(--mono); color:var(--cyan); font-weight:600;">${k.success_rate_pct}%</td>
      <td style="padding: 8px 10px; font-family:var(--mono); color:${k.consecutive_errors > 0 ? 'var(--red)' : 'var(--muted)'};">${k.consecutive_errors}</td>
      <td style="padding: 8px 10px; color:var(--muted); font-size:0.75rem;">${lastUsedStr}</td>
    </tr>`;
  }).join('');
}

async function resetCircuitBreakers(provider) {
  const url = provider ? `/api/v1/circuit_breaker/reset?provider=${encodeURIComponent(provider)}` : '/api/v1/circuit_breaker/reset';
  const r = await apiFetch(url, { method: 'POST' });
  if (r && r.ok) {

    toast(`Reset ${res.reset_keys} circuit breaker(s)!`, 'success');
    loadKeyAnalytics();

}

function filterActiveModelsTable() {

function filterConsoleModels() {

// ─── PROVIDER PING & HEALTH PROBES ─────────────────────────────────────────────
async function pingSingleProvider(name, btn) {
  const pName = name.toLowerCase();
  const origText = btn ? btn.innerHTML : '';
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner" style="width:12px; height:12px; display:inline-block; vertical-align:middle;"></span>';
  }
  const latencyEl = document.getElementById(`latency-val-${pName}`);
  if (latencyEl) latencyEl.innerHTML = '<span style="color:var(--muted)">Probing...</span>';

  try {
    const r = await apiFetch(`/api/v1/providers/${pName}/ping`, { method: 'POST' });
    if (!r) throw new Error('Network error');
    const res = await r.json();
    if (res.healthy) {
      const ms = Math.round(res.latency_ms);
      if (latencyEl) latencyEl.innerHTML = `<span style="color:var(--green); font-weight:600;">⚡ ${ms}ms</span>`;
      toast(`[${name}] Healthy! Probe returned 200 OK in ${ms}ms (${res.probe || 'ok'})`, 'success');
    } else {
      const err = res.error || `HTTP ${res.status_code}`;
      if (latencyEl) latencyEl.innerHTML = `<span style="color:var(--danger); font-weight:600;">❌ Err</span>`;
      toast(`[${name}] Probe failed: ${err}`, 'error');
    }
  } catch (e) {
    if (latencyEl) latencyEl.innerHTML = `<span style="color:var(--danger)">❌ Fail</span>`;
    toast(`[${name}] Ping failed: ${e.message}`, 'error');
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = origText || '⚡ Ping';
    }
  }
}

async function pingAllProviders(btn) {
  const origText = btn ? btn.innerHTML : '';
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '⚡ Probing All...';
  }
  try {
    toast('Probing all providers concurrently...', 'info');
    const r = await apiFetch('/api/v1/providers/ping_all', { method: 'POST' });
    if (!r) throw new Error('Network error');
    const results = await r.json();
    let healthyCount = 0;
    let totalCount = 0;
    for (const [pName, res] of Object.entries(results)) {
      totalCount++;
      const latencyEl = document.getElementById(`latency-val-${pName.toLowerCase()}`);
      if (res.healthy) {
        healthyCount++;
        const ms = Math.round(res.latency_ms);
        if (latencyEl) latencyEl.innerHTML = `<span style="color:var(--green); font-weight:600;">⚡ ${ms}ms</span>`;
      } else {
        if (latencyEl) latencyEl.innerHTML = `<span style="color:var(--danger); font-weight:600;">❌ Err</span>`;
      }
    }
    toast(`Health probe finished: ${healthyCount}/${totalCount} providers healthy`, healthyCount === totalCount ? 'success' : 'warning');
  } catch (e) {
    toast(`Ping all failed: ${e.message}`, 'error');
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = origText || '⚡ Ping All';
    }
  }
}


async function resetProviderCircuit(name, btn) {
  const origText = btn ? btn.innerHTML : '';
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = 'Resetting...';

  try {

}

// ── VIRTUAL GATEWAY KEYS ─────────────────────────────────
let gatewayKeys = [];
let gatewayKeyStats = {};
let gatewayKeyFilter = 'all';
let revealedGatewayKey = '';

function vkEscape(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}

function vkNumber(value) {
  return Number(value || 0).toLocaleString();
}

function vkMoney(value) {
  return value == null ? '—' : `$${Number(value).toFixed(2)}`;
}

function vkDate(value) {
  if (!value) return '—';
  const date = new Date(Number(value) * 1000);
  return Number.isNaN(date.getTime()) ? '—' : date.toLocaleString();
}

function vkState(record) {
  if (record.revoked_at) return { label: 'Revoked', cls: '' };
  if (record.expires_at && Number(record.expires_at) * 1000 <= Date.now()) return { label: 'Expired', cls: 'expired' };
  if (!record.enabled) return { label: 'Paused', cls: '' };
  return { label: 'Active', cls: 'active' };
}

async function gatewayKeyRequest(url, options = {}) {
  const response = await apiFetch(url, options);
  if (!response) throw new Error('Your dashboard session has ended. Sign in again.');
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(payload.detail || payload.error?.message || `Request failed (${response.status})`);
  return payload;
}

async function loadGatewayKeys() {
  const body = document.getElementById('vk-table-body');
  const error = document.getElementById('vk-list-error');
  if (!body) return;
  error.hidden = true;
  if (!gatewayKeys.length) body.innerHTML = '<tr><td colspan="6" class="vk-empty">Loading virtual keys…</td></tr>';
  try {
    const data = await gatewayKeyRequest('/api/v1/gateway/keys');
    gatewayKeys = Array.isArray(data.keys) ? data.keys : [];
    gatewayKeyStats = data.stats || {};
    renderGatewayKeyStats();
    renderGatewayKeys();
  } catch (err) {
    error.textContent = `Could not load virtual keys: ${err.message}`;
    error.hidden = false;
    body.innerHTML = '<tr><td colspan="6" class="vk-empty">Key data is unavailable. Retry by reopening Virtual Keys.</td></tr>';
  }
}

function renderGatewayKeyStats() {
  document.getElementById('vk-stat-active').textContent = vkNumber(gatewayKeyStats.active_keys);
  document.getElementById('vk-stat-requests').textContent = vkNumber(gatewayKeyStats.total_requests);
  document.getElementById('vk-stat-tokens').textContent = vkNumber(gatewayKeyStats.total_tokens);
  document.getElementById('vk-stat-spend').textContent = vkMoney(gatewayKeyStats.total_spend_usd);
}

function renderGatewayKeys() {
  const body = document.getElementById('vk-table-body');
  if (!body) return;
  const query = (document.getElementById('vk-search')?.value || '').trim().toLowerCase();
  const visible = gatewayKeys.filter(key => {
    const state = vkState(key);
    if (gatewayKeyFilter === 'active' && state.label !== 'Active') return false;
    if (gatewayKeyFilter === 'inactive' && state.label === 'Active') return false;
    const teamTag = (key.metadata && key.metadata.team) ? String(key.metadata.team) : '';
    const haystack = [key.name, key.id, key.key_prefix, teamTag, ...(key.allowed_models || [])].join(' ').toLowerCase();
    return !query || haystack.includes(query);
  });

  if (!visible.length) {
    const emptyText = gatewayKeys.length ? 'No keys match this filter.' : 'No virtual keys yet. Create one to issue a scoped credential.';
    body.innerHTML = `<tr><td colspan="6" class="vk-empty">${emptyText}</td></tr>`;
    return;
  }

  body.innerHTML = visible.map(key => {
    const state = vkState(key);
    const id = vkEscape(key.id);
    const allowedModels = key.allowed_models || [];
    const scope = allowedModels.length ? allowedModels.join(', ') : 'All configured models';
    const budget = key.budget_usd == null ? null : Number(key.budget_usd);
    const spent = Number(key.spent_usd || 0);
    const pct = budget && budget > 0 ? Math.min(100, (spent / budget) * 100) : 0;
    let barColor = 'linear-gradient(90deg, #10b981, #00ff9d)';
    if (pct >= 80) barColor = 'linear-gradient(90deg, #ef4444, #ff3b5c)';
    else if (pct >= 50) barColor = 'linear-gradient(90deg, #f59e0b, #ffd60a)';

    const alertPill = key.alert_sent 
      ? `<span style="background:rgba(255,59,92,0.18); border:1px solid rgba(255,59,92,0.4); color:var(--red); font-size:0.7rem; font-weight:700; padding:1px 6px; border-radius:4px; margin-left:6px;">⚠️ Alerted</span>` 
      : (key.budget_alert_threshold && pct >= (key.budget_alert_threshold * 100)
        ? `<span style="background:rgba(255,214,10,0.18); border:1px solid rgba(255,214,10,0.4); color:var(--yellow); font-size:0.7rem; font-weight:700; padding:1px 6px; border-radius:4px; margin-left:6px;">⚠️ ${Math.round(key.budget_alert_threshold*100)}% Warn</span>`
        : '');

    const usage = budget == null
      ? `<span style="font-family:var(--mono); font-size:0.85rem; font-weight:600; color:var(--text);">${vkMoney(spent)}</span>`
      : `<div style="display:flex; flex-direction:column; align-items:flex-end; gap:3px;">
          <div style="display:flex; align-items:center;">
            <span style="font-family:var(--mono); font-size:0.85rem; font-weight:600; color:var(--text);">${vkMoney(spent)} <span style="color:var(--muted2); font-weight:400;">/ ${vkMoney(budget)}</span></span>
            ${alertPill}
          </div>
          <div style="width:110px; height:5px; background:rgba(255,255,255,0.08); border-radius:4px; overflow:hidden; margin-top:2px;" title="${pct.toFixed(1)}% of budget used">
            <div style="height:100%; width:${pct.toFixed(1)}%; background:${barColor}; border-radius:4px; transition:width 0.3s ease;"></div>
          </div>
          <span style="font-size:0.72rem; color:var(--muted2);">${pct.toFixed(1)}% spent</span>
        </div>`;
    const progress = '';
    const currentWindow = [
      key.rpm_limit ? `${vkNumber(key.window_requests)} / ${vkNumber(key.rpm_limit)} rpm` : `${vkNumber(key.window_requests)} req`,
      key.tpm_limit ? `${vkNumber(key.window_tokens)} / ${vkNumber(key.tpm_limit)} tpm` : `${vkNumber(key.window_tokens)} tokens`,
    ].join(' · ');
    const limitParts = [];
    if (key.rpm_limit) limitParts.push(`${vkNumber(key.rpm_limit)} rpm`);
    if (key.tpm_limit) limitParts.push(`${vkNumber(key.tpm_limit)} tpm`);
    if (key.expires_at) limitParts.push(`expires ${vkEscape(vkDate(key.expires_at))}`);
    const limitLine = limitParts.length ? limitParts.join(' · ') : 'No request limit or expiry';
    const enableAction = !key.revoked_at && !(key.expires_at && Number(key.expires_at) * 1000 <= Date.now())
      ? `<button class="vk-action" type="button" data-vk-action="toggle" data-vk-id="${id}">${key.enabled ? 'Pause' : 'Enable'}</button>` : '';
    const teamBadge = (key.metadata && key.metadata.team)
      ? `<span style="font-size:0.68rem; background:rgba(124,111,255,0.18); color:#c084fc; border:1px solid rgba(124,111,255,0.35); padding:1px 6px; border-radius:4px; margin-left:6px; font-weight:600;">👥 ${vkEscape(key.metadata.team)}</span>`
      : '';
    return `<tr>
      <td class="vk-identity"><div class="vk-name">${vkEscape(key.name)}${teamBadge}</div><div class="vk-meta">${vkEscape(key.key_prefix)} · ${id}</div><span class="vk-mobile-sub">${vkEscape(limitLine)}</span></td>
      <td data-label="Models"><div class="vk-scope" title="${vkEscape(scope)}">${vkEscape(scope)}</div></td>
      <td data-label="Current window" class="num">${currentWindow}<span class="vk-usage-sub">${vkNumber(key.total_requests)} total requests · ${vkNumber(key.total_tokens)} total tokens</span></td>
      <td data-label="Spend" class="num">${usage}${progress}</td>
      <td data-label="State"><span class="vk-status ${state.cls}">${state.label}</span></td>
      <td data-label="Actions"><div class="vk-actions">
        <button class="vk-action" type="button" data-vk-action="edit" data-vk-id="${id}">Edit</button>
        ${enableAction}
        <button class="vk-action" type="button" data-vk-action="rotate" data-vk-id="${id}">Rotate</button>
        ${!key.revoked_at ? `<button class="vk-action danger" type="button" data-vk-action="revoke" data-vk-id="${id}">Revoke</button>` : ''}
        <button class="vk-action danger" type="button" data-vk-action="delete" data-vk-id="${id}">Delete</button>
      </div></td>
    </tr>`;
  }).join('');
}


function onVkScopeChange(val) {
  const allLbl = document.getElementById('scope-opt-all-lbl');
  const provLbl = document.getElementById('scope-opt-prov-lbl');
  const customLbl = document.getElementById('scope-opt-custom-lbl');
  const provBox = document.getElementById('vk-provider-selector');
  const customBox = document.getElementById('vk-custom-models-container');
  const textarea = document.getElementById('vk-create-models');

  [allLbl, provLbl, customLbl].forEach(l => {
    if (l) {
      l.style.borderColor = 'rgba(255,255,255,0.12)';
      l.style.background = 'rgba(0,0,0,0.3)';
    }
  });

  if (val === 'all') {
    if (allLbl) {
      allLbl.style.borderColor = '#7c6fff';
      allLbl.style.background = 'rgba(124, 111, 255, 0.12)';
    }
    if (provBox) provBox.style.display = 'none';
    if (customBox) customBox.style.display = 'none';
    if (textarea) textarea.value = '';
  } else if (val === 'provider') {
    if (provLbl) {

    }
    if (provBox) provBox.style.display = 'block';

      customLbl.style.background = 'rgba(124, 111, 255, 0.12)';
    }
    if (provBox) provBox.style.display = 'none';

async function createGatewayKey(event) {
  event.preventDefault();
  const submit = event.submitter;
  if (submit) submit.disabled = true;
  try {
    const meta = {};
    const qTimeout = vkOptionalNumber('vk-create-queue');
    if (qTimeout) meta.queue_timeout = qTimeout;
    const teamVal = document.getElementById('vk-create-team')?.value.trim();
    if (teamVal) meta.team = teamVal;
    const data = await gatewayKeyRequest('/api/v1/gateway/keys', {
      method: 'POST',
      body: JSON.stringify({
        name: document.getElementById('vk-create-name').value.trim(),
        budget_usd: vkOptionalNumber('vk-create-budget'),
        budget_alert_threshold: vkOptionalNumber('vk-create-alert-threshold') ? (vkOptionalNumber('vk-create-alert-threshold') / 100.0) : null,
        budget_alert_webhook: document.getElementById('vk-create-webhook')?.value.trim() || null,
        auto_pause_on_budget: document.getElementById('vk-create-auto-pause')?.checked ?? true,
        rpm_limit: vkOptionalNumber('vk-create-rpm'),
        tpm_limit: vkOptionalNumber('vk-create-tpm'),
        expires_in: vkOptionalNumber('vk-create-expiry', 3600),
        allowed_models: vkParseModels('vk-create-models'),
        metadata: meta,
      }),
    });
    closeGatewayKeyModal('vk-create-overlay');
    showGatewayKeySecret(data.key);
    await loadGatewayKeys();
    toast('Virtual key created.', 'success');
  } catch (err) {
    toast(`Could not create key: ${err.message}`, 'error');
  } finally {
    if (submit) submit.disabled = false;
  }
}

function showGatewayKeySecret(secret) {
  revealedGatewayKey = String(secret || '');
  document.getElementById('vk-secret-value').textContent = revealedGatewayKey;
  const bUrl = document.getElementById('vk-secret-base-url'); if (bUrl) bUrl.textContent = ((window.location.origin && window.location.origin !== 'null') ? window.location.origin : 'http://127.0.0.1:8000') + '/v1';
  const copyStatus = document.getElementById('vk-copy-status'); if (copyStatus) copyStatus.textContent = '';
  document.getElementById('vk-secret-overlay').classList.add('open');
}

function closeGatewayKeySecret() {
  revealedGatewayKey = '';
  document.getElementById('vk-secret-value').textContent = '';
  closeGatewayKeyModal('vk-secret-overlay');
}

async function copyGatewayKey() {
  const status = document.getElementById('vk-copy-status');
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(revealedGatewayKey);
    } else {
      const input = document.createElement('textarea');
      input.value = revealedGatewayKey;
      input.style.position = 'fixed';
      input.style.opacity = '0';
      document.body.appendChild(input);
      input.select();
      const copied = document.execCommand('copy');
      input.remove();
      if (!copied) throw new Error('Clipboard is unavailable');
    }
    if (status) status.textContent = 'Copied';
    toast('API Key copied to clipboard!', 'success');
  } catch (_) {
    if (status) status.textContent = 'Select and copy the key above.';
    toast('Select and copy the key manually', 'info');
  }
}

function editGatewayKey(id) {
  const key = gatewayKeys.find(record => record.id === id);
  if (!key) return;
  document.getElementById('vk-edit-id').value = key.id;
  document.getElementById('vk-edit-name').value = key.name || '';
  const editTeamEl = document.getElementById('vk-edit-team');
  if (editTeamEl) editTeamEl.value = (key.metadata && key.metadata.team) ? key.metadata.team : '';
  document.getElementById('vk-edit-budget').value = key.budget_usd ?? '';
  document.getElementById('vk-edit-rpm').value = key.rpm_limit ?? '';
  document.getElementById('vk-edit-tpm').value = key.tpm_limit ?? '';
  const alertThreshEl = document.getElementById('vk-edit-alert-threshold');
  if (alertThreshEl) alertThreshEl.value = key.budget_alert_threshold ? Math.round(key.budget_alert_threshold * 100) : '';
  const alertWebhookEl = document.getElementById('vk-edit-webhook');
  if (alertWebhookEl) alertWebhookEl.value = key.budget_alert_webhook || '';
  const autoPauseEl = document.getElementById('vk-edit-auto-pause');
  if (autoPauseEl) autoPauseEl.value = (key.auto_pause_on_budget !== false) ? 'true' : 'false';
  const stateSelect = document.getElementById('vk-edit-state');
  stateSelect.value = key.enabled ? 'true' : 'false';
  stateSelect.disabled = Boolean(key.revoked_at);
  stateSelect.title = key.revoked_at ? 'Rotate this key to clear its revoked state.' : '';
  document.getElementById('vk-edit-models').value = (key.allowed_models || []).join('\n');
  const expiresAt = document.getElementById('vk-edit-expiry');
  if (key.expires_at) {
    const local = new Date(Number(key.expires_at) * 1000);
    local.setMinutes(local.getMinutes() - local.getTimezoneOffset());
    expiresAt.value = local.toISOString().slice(0, 16);
  } else expiresAt.value = '';
  document.getElementById('vk-edit-overlay').classList.add('open');
  document.getElementById('vk-edit-name').focus();
}

async function saveGatewayKey(event) {
  event.preventDefault();
  const id = document.getElementById('vk-edit-id').value;
  const submit = event.submitter;
  if (submit) submit.disabled = true;
  try {
    const expiryValue = document.getElementById('vk-edit-expiry').value;
    const expiresAt = expiryValue ? new Date(expiryValue).getTime() / 1000 : null;
    const existingKey = gatewayKeys.find(r => r.id === id);
    const meta = Object.assign({}, (existingKey && existingKey.metadata) ? existingKey.metadata : {});
    const teamVal = document.getElementById('vk-edit-team')?.value.trim();
    if (teamVal) meta.team = teamVal;
    else delete meta.team;
    await gatewayKeyRequest(`/api/v1/gateway/keys/${encodeURIComponent(id)}`, {
      method: 'PATCH',
      body: JSON.stringify({
        name: document.getElementById('vk-edit-name').value.trim(),
        budget_usd: vkOptionalNumber('vk-edit-budget'),
        budget_alert_threshold: vkOptionalNumber('vk-edit-alert-threshold') ? (vkOptionalNumber('vk-edit-alert-threshold') / 100.0) : null,
        budget_alert_webhook: document.getElementById('vk-edit-webhook')?.value.trim() || null,
        auto_pause_on_budget: document.getElementById('vk-edit-auto-pause')?.value === 'true',
        rpm_limit: vkOptionalNumber('vk-edit-rpm'),
        tpm_limit: vkOptionalNumber('vk-edit-tpm'),
        ...(document.getElementById('vk-edit-state').disabled ? {} : { enabled: document.getElementById('vk-edit-state').value === 'true' }),
        expires_at: expiresAt,
        allowed_models: vkParseModels('vk-edit-models'),
        metadata: meta,
      }),
    });
    closeGatewayKeyModal('vk-edit-overlay');
    await loadGatewayKeys();
    toast('Virtual key updated.', 'success');
  } catch (err) {
    toast(`Could not update key: ${err.message}`, 'error');
  } finally {
    if (submit) submit.disabled = false;
  }
}

async function toggleGatewayKey(id) {
  const key = gatewayKeys.find(record => record.id === id);
  if (!key) return;
  try {
    await gatewayKeyRequest(`/api/v1/gateway/keys/${encodeURIComponent(id)}`, {
      method: 'PATCH', body: JSON.stringify({ enabled: !key.enabled }),
    });
    await loadGatewayKeys();
    toast(key.enabled ? 'Virtual key paused.' : 'Virtual key enabled.', 'success');
  } catch (err) { toast(`Could not update key: ${err.message}`, 'error'); }
}

async function rotateGatewayKey(id) {
  const key = gatewayKeys.find(record => record.id === id);
  if (!key || !window.confirm(`Rotate “${key.name}”? The current secret will stop working immediately.`)) return;
  try {
    const data = await gatewayKeyRequest(`/api/v1/gateway/keys/${encodeURIComponent(id)}/rotate`, { method: 'POST' });
    await loadGatewayKeys();
    showGatewayKeySecret(data.key);
    toast('Virtual key rotated.', 'success');
  } catch (err) { toast(`Could not rotate key: ${err.message}`, 'error'); }
}

async function revokeGatewayKey(id) {
  const key = gatewayKeys.find(record => record.id === id);
  if (!key || !window.confirm(`Revoke “${key.name}”? Existing clients will lose access immediately.`)) return;
  try {
    await gatewayKeyRequest(`/api/v1/gateway/keys/${encodeURIComponent(id)}/revoke`, { method: 'POST' });
    await loadGatewayKeys();
    toast('Virtual key revoked.', 'success');
  } catch (err) { toast(`Could not revoke key: ${err.message}`, 'error'); }
}

async function deleteGatewayKey(id) {
  const key = gatewayKeys.find(record => record.id === id);
  if (!key || !window.confirm(`Delete “${key.name}” and its usage record? This cannot be undone.`)) return;
  try {
    await gatewayKeyRequest(`/api/v1/gateway/keys/${encodeURIComponent(id)}`, { method: 'DELETE' });
    await loadGatewayKeys();
    toast('Virtual key deleted.', 'success');
  } catch (err) { toast(`Could not delete key: ${err.message}`, 'error'); }
}

// ── THREEUI 3D INTERACTIVE ENGINE ───────────────────────────
// 1. True 3D Particle Matrix & Cybernetic Starfield with Depth Parallax
(function initThreeUI3DCanvas() {
  const canvas = document.getElementById('threeui-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let width = 0, height = 0, dpr = 1;
  let animationId = null;
  let isRunning = true;

  // 3D camera & mouse parallax
  const camera = {
    x: 0, y: 0, z: 0,
    rotX: 0, rotY: 0,
    targetRotX: 0, targetRotY: 0
  };
  const mouse = { x: -9999, y: -9999, radius: 180 };

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
  }

  window.addEventListener('resize', resize, { passive: true });
  window.addEventListener('pointermove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    camera.targetRotY = (e.clientX / width - 0.5) * 0.7;
    camera.targetRotX = (e.clientY / height - 0.5) * -0.5;
  }, { passive: true });

  window.addEventListener('pointerleave', () => {
    mouse.x = -9999;
    mouse.y = -9999;
    camera.targetRotX = 0;
    camera.targetRotY = 0;
  }, { passive: true });

  // 3D Particle Generator
  const particleCount = Math.max(45, Math.min(85, Math.floor((window.innerWidth * window.innerHeight) / 18000)));
  const particles = [];
  const palette = [
    { r: 124, g: 111, b: 255 }, // electric violet
    { r: 0,   g: 212, b: 255 }, // cyber cyan
    { r: 0,   g: 255, b: 157 }, // neon emerald
    { r: 255, g: 214, b: 10 }   // spark yellow
  ];

  for (let i = 0; i < particleCount; i++) {
    const col = palette[Math.floor(Math.random() * palette.length)];
    particles.push({
      x: (Math.random() - 0.5) * 1200,
      y: (Math.random() - 0.5) * 900,
      z: (Math.random() - 0.5) * 800,
      vx: (Math.random() - 0.5) * 0.6,
      vy: (Math.random() - 0.5) * 0.6,
      vz: (Math.random() - 0.5) * 0.4,
      baseRadius: Math.random() * 2.2 + 1.2,
      color: col,
      alpha: Math.random() * 0.4 + 0.4,
      pulse: Math.random() * Math.PI * 2,
      pulseSpeed: 0.025 + Math.random() * 0.035
    });
  }

  const FOCAL = 450;

  function animate() {
    if (!isRunning) return;
    ctx.clearRect(0, 0, width, height);

    // Smooth camera inertia
    camera.rotX += (camera.targetRotX - camera.rotX) * 0.06;
    camera.rotY += (camera.targetRotY - camera.rotY) * 0.06;

    const cosY = Math.cos(camera.rotY);
    const sinY = Math.sin(camera.rotY);
    const cosX = Math.cos(camera.rotX);
    const sinX = Math.sin(camera.rotX);

    const centerX = width / 2;
    const centerY = height / 2;

    const projected = [];

    // 3D Transform and projection
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.z += p.vz;
      p.pulse += p.pulseSpeed;

      // Soft 3D bounds bounce
      if (p.x < -650) { p.x = -650; p.vx *= -1; }
      if (p.x > 650) { p.x = 650; p.vx *= -1; }
      if (p.y < -500) { p.y = -500; p.vy *= -1; }
      if (p.y > 500) { p.y = 500; p.vy *= -1; }
      if (p.z < -450) { p.z = -450; p.vz *= -1; }
      if (p.z > 450) { p.z = 450; p.vz *= -1; }

      // 3D Rotation (Y then X)
      const x1 = p.x * cosY - p.z * sinY;
      const z1 = p.z * cosY + p.x * sinY;
      const y1 = p.y * cosX - z1 * sinX;
      const z2 = z1 * cosX + p.y * sinX;

      const zDepth = z2 + 650;
      if (zDepth <= 10) continue;

      const scale = FOCAL / zDepth;
      const projX = centerX + x1 * scale;
      const projY = centerY + y1 * scale;

      projected.push({
        p,
        projX,
        projY,
        scale,
        depth: z2
      });
    }

    // Connective 3D lines
    for (let i = 0; i < projected.length; i++) {
      const p1 = projected[i];

      // Mouse Gravitation & Tether
      const dxM = mouse.x - p1.projX;
      const dyM = mouse.y - p1.projY;
      const distM = Math.sqrt(dxM * dxM + dyM * dyM);

      if (distM < mouse.radius) {
        const factor = 1 - distM / mouse.radius;
        // Tether beam
        ctx.beginPath();
        ctx.moveTo(p1.projX, p1.projY);
        ctx.lineTo(mouse.x, mouse.y);
        ctx.strokeStyle = `rgba(${p1.p.color.r}, ${p1.p.color.g}, ${p1.p.color.b}, ${factor * 0.45})`;
        ctx.lineWidth = factor * 1.5;
        ctx.stroke();

        // Nudge in 3D
        p1.p.x += (dxM / distM) * factor * 0.5;
        p1.p.y += (dyM / distM) * factor * 0.5;
      }

      // Constellation webs between nearby particles
      for (let j = i + 1; j < projected.length; j++) {
        const p2 = projected[j];
        const dx = p1.projX - p2.projX;
        const dy = p1.projY - p2.projY;
        const dist2D = Math.sqrt(dx * dx + dy * dy);

        if (dist2D < 115) {
          const alpha = (1 - dist2D / 115) * 0.25 * ((p1.depth + 450) / 900);
          ctx.beginPath();
          ctx.moveTo(p1.projX, p1.projY);
          ctx.lineTo(p2.projX, p2.projY);
          ctx.strokeStyle = `rgba(124, 111, 255, ${alpha})`;
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }
      }
    }

    // Draw 3D nodes sorted by depth
    projected.sort((a, b) => a.depth - b.depth);

    for (let i = 0; i < projected.length; i++) {
      const item = projected[i];
      const p = item.p;
      const r = (p.baseRadius + Math.sin(p.pulse) * 0.6) * item.scale;
      const alpha = Math.max(0.15, Math.min(0.9, p.alpha * ((item.depth + 450) / 750)));

      ctx.beginPath();
      ctx.arc(item.projX, item.projY, Math.max(0.5, r), 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${p.color.r}, ${p.color.g}, ${p.color.b}, ${alpha})`;
      ctx.shadowColor = `rgba(${p.color.r}, ${p.color.g}, ${p.color.b}, 0.85)`;
      ctx.shadowBlur = 10 * item.scale;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    animationId = requestAnimationFrame(animate);
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      isRunning = false;
      if (animationId) cancelAnimationFrame(animationId);
    } else {
      isRunning = true;
      resize();
      animationId = requestAnimationFrame(animate);
    }
  });

  resize();
  animationId = requestAnimationFrame(animate);
})();

// 2. Interactive 3D Card Tilt & Mouse Spotlight Engine
function initThreeUICardEffects() {
  const cards = document.querySelectorAll('.stat-card, .provider-card, .login-card');
  cards.forEach(card => {
    if (card._hasThreeUITilt) return;
    card._hasThreeUITilt = true;

    card.addEventListener('pointermove', e => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      card.style.setProperty('--mouse-x', `${x}px`);
      card.style.setProperty('--mouse-y', `${y}px`);
      
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      const rotateX = ((y - centerY) / centerY) * -5;
      const rotateY = ((x - centerX) / centerX) * 5;
      
      card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-2px)`;
    });
    
    card.addEventListener('pointerleave', () => {
      card.style.transform = '';
      card.style.setProperty('--mouse-x', '50%');
      card.style.setProperty('--mouse-y', '50%');
    });
  });
}

// 3. Animated Top Dock Proximity Spring
function initTopbarDock() {
  const nav = document.querySelector('.topbar-nav');
  if (!nav || nav._hasThreeUIDock) return;
  nav._hasThreeUIDock = true;

  const items = nav.querySelectorAll('.nav-btn');
  
  nav.addEventListener('pointermove', e => {
    const mouseX = e.clientX;
    items.forEach(item => {
      const rect = item.getBoundingClientRect();
      const itemCenterX = rect.left + rect.width / 2;
      const dist = Math.abs(mouseX - itemCenterX);
      const maxDist = 90;
      if (dist < maxDist) {
        const factor = 1 - (dist / maxDist);
        const lift = factor * -2.5;
        item.style.transform = `translateY(${lift}px)`;
      } else {
        item.style.transform = '';
      }
    });

      if (modeRadio) modeRadio.checked = true;

      if (threshEl && cfg.injection_threshold !== undefined) {

let mcpToolsCache = [];

async function loadMCPTools() {
  const grid = document.getElementById('mcp-tools-grid');
  grid.innerHTML = '<div class="loading-row"><div class="spinner"></div> Loading MCP tools...</div>';

  try {
    const r = await fetch('/mcp/v1/tools?format=mcp');

      grid.innerHTML = '<div style="color:var(--muted); font-size:0.85rem; padding:12px;">Failed to load MCP tools.</div>';
      return;
    }
    const data = await r.json();
    mcpToolsCache = data.tools || [];
    document.getElementById('mcp-tools-count').textContent = mcpToolsCache.length;

    // Populate dropdown in runner
    const runnerSelect = document.getElementById('mcp-runner-tool');
    runnerSelect.innerHTML = '<option value="">— Select an MCP tool —</option>' + mcpToolsCache.map(t => `<option value="${escapeHtml(t.name)}">${escapeHtml(t.name)} (${escapeHtml(t.server || 'builtin')})</option>`).join('');

      grid.innerHTML = '<div style="color:var(--muted); font-size:0.85rem; padding:12px;">No MCP tools registered.</div>';

          <span style="font-size: 0.68rem; padding: 2px 6px; border-radius: 6px; background: rgba(124,111,255,0.15); color: var(--primary); border: 1px solid rgba(124,111,255,0.3); text-transform: uppercase;">${escapeHtml(t.server || 'mcp')}</span>
        </div>
        <div style="font-size: 0.8rem; color: var(--muted); margin-bottom: 10px; min-height: 36px;">
          ${escapeHtml(t.description || 'No description provided.')}
        </div>
        <div style="font-size: 0.72rem; color: var(--muted2); background: rgba(0,0,0,0.4); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); font-family: var(--mono); overflow-x: auto;">
          params: ${t.inputSchema && t.inputSchema.properties ? Object.keys(t.inputSchema.properties).map(escapeHtml).join(', ') : 'none'}

  }

function selectMcpToolForRunner(name) {
  const sel = document.getElementById('mcp-runner-tool');
  if (sel) {
    sel.value = name;
    onMcpToolSelect();
    document.getElementById('mcp-runner-tool').scrollIntoView({ behavior: 'smooth' });
  }
}

function onMcpToolSelect() {
  const toolName = document.getElementById('mcp-runner-tool').value;
  const tool = mcpToolsCache.find(t => t.name === toolName);
  const descEl = document.getElementById('mcp-runner-desc');
  const argsEl = document.getElementById('mcp-runner-args');

  if (!tool) {
    descEl.textContent = '';
    return;
  }

  descEl.textContent = tool.description || '';
  if (tool.name === 'calculator' || tool.name === 'eval_math_expression') {
    argsEl.value = JSON.stringify({ expression: "42 * (10 + 5)" }, null, 2);
  } else if (tool.name === 'veloroute_route_estimate' || tool.name === 'estimate_routing_path') {
    argsEl.value = JSON.stringify({ prompt: "What is quantum computing?", model: "openai/gpt-4o" }, null, 2);
  } else if (tool.name === 'system_clock') {
    argsEl.value = JSON.stringify({ format: "iso" }, null, 2);
  } else if (tool.name === 'json_validator') {
    argsEl.value = JSON.stringify({ payload: "{\"service\":\"veloroute\",\"healthy\":true}" }, null, 2);
  } else if (tool.name === 'markdown_outline') {
    argsEl.value = JSON.stringify({ markdown: "# Architecture\n## Routing\n### Hedging\n## Security" }, null, 2);
  } else if (tool.name === 'token_counter') {
    argsEl.value = JSON.stringify({ text: "Estimate tokens and API cost across GPT-4o and DeepSeek.", model: "openai/gpt-4o" }, null, 2);
  } else if (tool.name === 'prompt_security_scan') {
    argsEl.value = JSON.stringify({ text: "Contact alice@corp.io with key sk-ant-api03-1234567890abcdef123456" }, null, 2);
  } else if (tool.inputSchema && tool.inputSchema.properties) {
    const sample = {};
    for (const [k, v] of Object.entries(tool.inputSchema.properties)) {
      sample[k] = v.type === 'number' ? 0 : v.type === 'boolean' ? false : (v.default || "sample");
    }
    argsEl.value = JSON.stringify(sample, null, 2);
  }
}

async function runMcpToolCall() {
  const toolName = document.getElementById('mcp-runner-tool').value;
  if (!toolName) {
    toast('Select a tool to execute', 'error');
    return;
  }
  let args = {};
  try {
    const rawArgs = document.getElementById('mcp-runner-args').value.trim();
    if (rawArgs) args = JSON.parse(rawArgs);
  } catch (err) {
    toast('Invalid JSON in arguments: ' + err.message, 'error');
    return;
  }

  const outEl = document.getElementById('mcp-runner-output');
  const statusEl = document.getElementById('mcp-runner-status');
  statusEl.textContent = 'Executing...';
  outEl.textContent = '// Running tool call via JSON-RPC 2.0...\n';

  const t0 = performance.now();
  try {
    const r = await fetch('/mcp/v1/call', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: toolName, arguments: args }),
    });
    const dur = Math.round(performance.now() - t0);
    const data = await r.json();
    outEl.textContent = JSON.stringify(data, null, 2);
    statusEl.innerHTML = `<span style="color:var(--green)">Success (${dur}ms)</span>`;
    toast(`Executed ${toolName} in ${dur}ms`, 'success');
  } catch (err) {
    outEl.textContent = '// Error executing tool: ' + err.message;
    statusEl.innerHTML = `<span style="color:var(--red)">Failed</span>`;
  }
}

function onTransformTypeChange() {

  const replaceWrap = document.getElementById('tr-replacement-wrap');
  const replaceLabel = document.getElementById('tr-replace-label');

    matchLabel.textContent = 'Prohibited Word / Sensitive Codename to Redact';
    replaceWrap.style.display = 'block';
    replaceLabel.textContent = 'Redacted Replacement Text (e.g. [REDACTED] or [CONFIDENTIAL])';

  const rule_type = document.getElementById('tr-type').value;
  const match_pattern = document.getElementById('tr-pattern').value.trim();
  const replacement = document.getElementById('tr-replacement').value.trim();
  const description = document.getElementById('tr-desc').value.trim();

  if (!name || !match_pattern) {
    toast('Please fill in Rule Name and Match Pattern', 'error');

      ? '<span style="color:var(--green); font-weight:700;">✅ Modified by Rule</span>'

    resultBox.innerHTML = `
      <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
        <span style="font-weight:700; color:var(--text);">Test Type: ${data.test_type}</span>
        ${modifiedBadge}
      </div>
      <div style="margin-bottom:4px; color:var(--muted);">Original: <span style="color:#fff;">${escapeHtml(JSON.stringify(data.original))}</span></div>
      <div style="color:var(--cyan);">Transformed: <span style="font-weight:700; color:#a5f3fc;">${escapeHtml(JSON.stringify(data.transformed))}</span></div>
    `;
  } catch (err) {
    toast('Sandbox test error', 'error');
  }
}
