// ── SIDE-BY-SIDE A/B COMPARATOR LOGIC ───────────────────
function switchConsoleMode(mode) {
  const singleBtn = document.getElementById('btn-mode-single');
  const compareBtn = document.getElementById('btn-mode-compare');
  const singleLayout = document.getElementById('console-single-layout');
  const compareLayout = document.getElementById('console-compare-layout');

  if (mode === 'compare') {
    singleBtn.classList.remove('active');
    singleBtn.classList.add('btn-ghost');
    compareBtn.classList.add('active');
    compareBtn.classList.remove('btn-ghost');
    singleLayout.style.display = 'none';
    compareLayout.style.display = 'flex';
    initComparatorDropdowns();
  } else {
    compareBtn.classList.remove('active');
    compareBtn.classList.add('btn-ghost');
    singleBtn.classList.add('active');
    singleBtn.classList.remove('btn-ghost');
    compareLayout.style.display = 'none';
    singleLayout.style.display = 'grid';
  }
}

function initComparatorDropdowns() {
  const provA = document.getElementById('cmp-provider-a');
  const provB = document.getElementById('cmp-provider-b');
  if (!provA || !provB) return;

  const provs = Object.keys(activeModels || {});
  if (!provs.length) return;

  const optionsHtml = provs.map(p => `<option value="${p}">${p}</option>`).join('');
  if (!provA.innerHTML || provA.options.length <= 1) {
    provA.innerHTML = optionsHtml;
    provB.innerHTML = optionsHtml;
    if (provs.length > 1) {
      provB.selectedIndex = 1;
    }
  }
  updateComparatorModels('a');
  updateComparatorModels('b');
}

function updateComparatorModels(target) {
  const prov = document.getElementById(`cmp-provider-${target}`).value;
  const modelSel = document.getElementById(`cmp-model-${target}`);
  if (!prov || !modelSel) return;

  const models = activeModels[prov] || [];
  modelSel.innerHTML = models.map(m => {
    const full = m.includes('/') ? m : `${prov}/${m}`;
    return `<option value="${full}">${m}</option>`;
  }).join('');
}

async function runModelComparison() {
  const modelA = document.getElementById('cmp-model-a').value;
  const modelB = document.getElementById('cmp-model-b').value;
  const prompt = document.getElementById('cmp-prompt').value.trim();
  const systemPrompt = document.getElementById('cmp-system').value.trim();
  const temperature = parseFloat(document.getElementById('cmp-temp').value) || 0.7;
  const maxTokens = parseInt(document.getElementById('cmp-tokens').value) || 512;

  const runBtn = document.getElementById('cmp-run-btn');
  const statusEl = document.getElementById('cmp-status');
  const outA = document.getElementById('cmp-output-a');
  const outB = document.getElementById('cmp-output-b');
  const metaA = document.getElementById('cmp-meta-a');
  const metaB = document.getElementById('cmp-meta-b');
  const titleA = document.getElementById('cmp-title-a');
  const titleB = document.getElementById('cmp-title-b');
  const banner = document.getElementById('cmp-winner-banner');

  if (!prompt) {
    toast('Please enter a benchmark prompt to compare both models', 'error');
    return;
  }
  if (!modelA || !modelB) {
    toast('Please select both Model A and Model B', 'error');
    return;
  }

  titleA.textContent = modelA;
  titleB.textContent = modelB;
  runBtn.disabled = true;
  statusEl.textContent = '⏳ Executing parallel comparison...';
  outA.textContent = '// Running Model A in parallel...\n';
  outB.textContent = '// Running Model B in parallel...\n';
  banner.style.display = 'none';

  try {
    const res = await apiFetch('/api/v1/comparator/run', {
      method: 'POST',
      body: JSON.stringify({
        model_a: modelA,
        model_b: modelB,
        prompt: prompt,
        system_prompt: systemPrompt || undefined,
        temperature: temperature,
        max_tokens: maxTokens,
      }),
    });
    if (!res) return;
    const data = await res.json();

    const a = data.model_a;
    const b = data.model_b;

    // Render Model A
    outA.textContent = a.content || 'No response content';
    if (a.status === 'success') {
      metaA.innerHTML = `
        <span class="badge" style="background:rgba(124,111,255,0.18); color:#c084fc; border:1px solid rgba(124,111,255,0.3); font-size:0.75rem;">⚡ ${a.latency_ms}ms</span>
        <span class="badge" style="background:rgba(0,212,255,0.15); color:var(--cyan); border:1px solid rgba(0,212,255,0.3); font-size:0.75rem;">📊 ${a.total_tokens} tok (${a.tokens_per_sec} tok/s)</span>
        <span class="badge" style="background:rgba(0,255,157,0.15); color:var(--green); border:1px solid rgba(0,255,157,0.3); font-size:0.75rem;">💰 $${a.cost_usd}</span>
        <button type="button" class="btn btn-sm btn-ghost" style="padding:1px 6px; font-size:0.72rem;" title="Vote Model A Better" onclick="submitModelFeedback('${escapeHtml(modelA)}', 1, this)">👍</button>
        <button type="button" class="btn btn-sm btn-ghost" style="padding:1px 6px; font-size:0.72rem;" title="Vote Model A Worse" onclick="submitModelFeedback('${escapeHtml(modelA)}', -1, this)">👎</button>
      `;
    } else {
      metaA.innerHTML = `<span class="badge badge-error">❌ ${escapeHtml(a.content)}</span>`;
    }

    // Render Model B
    outB.textContent = b.content || 'No response content';
    if (b.status === 'success') {
      metaB.innerHTML = `
        <span class="badge" style="background:rgba(0,212,255,0.15); color:var(--cyan); border:1px solid rgba(0,212,255,0.3); font-size:0.75rem;">⚡ ${b.latency_ms}ms</span>
        <span class="badge" style="background:rgba(124,111,255,0.18); color:#c084fc; border:1px solid rgba(124,111,255,0.3); font-size:0.75rem;">📊 ${b.total_tokens} tok (${b.tokens_per_sec} tok/s)</span>
        <span class="badge" style="background:rgba(0,255,157,0.15); color:var(--green); border:1px solid rgba(0,255,157,0.3); font-size:0.75rem;">💰 $${b.cost_usd}</span>
        <button type="button" class="btn btn-sm btn-ghost" style="padding:1px 6px; font-size:0.72rem;" title="Vote Model B Better" onclick="submitModelFeedback('${escapeHtml(modelB)}', 1, this)">👍</button>
        <button type="button" class="btn btn-sm btn-ghost" style="padding:1px 6px; font-size:0.72rem;" title="Vote Model B Worse" onclick="submitModelFeedback('${escapeHtml(modelB)}', -1, this)">👎</button>
      `;
    } else {
      metaB.innerHTML = `<span class="badge badge-error">❌ ${escapeHtml(b.content)}</span>`;
    }

    // Render Winner Banner
    if (data.speed_winner || data.cost_winner) {
      banner.style.display = 'block';
      const speedEl = document.getElementById('cmp-winner-speed');
      const costEl = document.getElementById('cmp-winner-cost');
      const effEl = document.getElementById('cmp-winner-efficiency');

      if (data.speed_winner) {
        const wModel = data.speed_winner.model;
        const pct = data.speed_winner.pct_faster;
        speedEl.innerHTML = `<strong>⚡ Speed Winner:</strong> <span style="color:#4ade80;">${escapeHtml(wModel)}</span> is <strong>${pct}% faster</strong> (${a.latency_ms}ms vs ${b.latency_ms}ms)`;
      } else {
        speedEl.innerHTML = `<strong>⚡ Speed:</strong> Identical latency`;
      }

      if (data.cost_winner) {
        const wModel = data.cost_winner.model;
        const pct = data.cost_winner.pct_cheaper;
        costEl.innerHTML = `<strong>💰 Cost Winner:</strong> <span style="color:#4ade80;">${escapeHtml(wModel)}</span> saves <strong>${pct}% cost</strong> ($${a.cost_usd} vs $${b.cost_usd})`;
      } else {
        costEl.innerHTML = `<strong>💰 Cost:</strong> Similar cost`;
      }

      effEl.innerHTML = `<strong>🚀 Generation Rate:</strong> Model A (${a.tokens_per_sec || 0} tok/s) vs Model B (${b.tokens_per_sec || 0} tok/s)`;
    }

    statusEl.textContent = '✅ Benchmark complete!';
    toast('A/B Benchmark completed successfully!', 'success');
  } catch (err) {
    statusEl.textContent = '❌ Comparison failed';
    toast('A/B Comparison failed: ' + err, 'error');
  } finally {
    runBtn.disabled = false;
  }
}


// ── LATENCY MATRIX & SLA MONITOR LOGIC ──────────────────
async function loadLatencyMatrix() {
  const tbody = document.getElementById('latency-matrix-table-body');
  if (!tbody) return;

  try {
    const res = await apiFetch('/api/v1/routing/latency_matrix');
    if (!res) return;
    const data = await res.json();
    const matrix = data.matrix || [];

    if (!matrix.length) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:16px; color:var(--muted);">No latency records tracked yet. Click "⚡ Probe All Latencies" to start telemetry.</td></tr>';
      return;
    }

    tbody.innerHTML = matrix.map(m => {
      const statusPill = m.status === 'healthy'
        ? `<span style="font-size:0.72rem; padding:2px 7px; border-radius:4px; background:rgba(0,255,157,0.15); color:var(--green); border:1px solid rgba(0,255,157,0.3); font-weight:600;">🟢 ${m.availability_pct}% SLA</span>`
        : (m.status === 'degraded'
          ? `<span style="font-size:0.72rem; padding:2px 7px; border-radius:4px; background:rgba(234,179,8,0.15); color:#facc15; border:1px solid rgba(234,179,8,0.3); font-weight:600;">🟡 ${m.availability_pct}% Degraded</span>`
          : `<span style="font-size:0.72rem; padding:2px 7px; border-radius:4px; background:rgba(239,68,68,0.15); color:#f87171; border:1px solid rgba(239,68,68,0.3); font-weight:600;">🔴 ${m.availability_pct}% Down</span>`);

      const recentDots = (m.recent_samples || []).map(lat => {
        const color = lat < 300 ? 'var(--green)' : (lat < 1000 ? '#facc15' : '#ef4444');
        return `<span style="display:inline-block; width:6px; height:12px; border-radius:2px; background:${color}; margin-right:3px;" title="${lat}ms"></span>`;
      }).join('');

      return `
        <tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
          <td style="padding:10px 14px;">
            <div style="font-weight:700; color:var(--text); text-transform:uppercase; font-size:0.8rem;">${escapeHtml(m.provider)}</div>
            <div style="font-size:0.7rem; color:var(--muted);">${m.sample_count} total requests</div>
          </td>
          <td style="padding:10px 14px;">${statusPill}</td>
          <td style="padding:10px 14px;"><strong style="font-family:var(--mono); color:var(--cyan);">${m.ewma_latency_ms ? m.ewma_latency_ms + 'ms' : '—'}</strong></td>
          <td style="padding:10px 14px;"><span style="font-family:var(--mono); color:var(--text);">${m.p50_latency_ms ? m.p50_latency_ms + 'ms' : '—'}</span></td>
          <td style="padding:10px 14px;"><span style="font-family:var(--mono); color:#c084fc; font-weight:600;">${m.p95_latency_ms ? m.p95_latency_ms + 'ms' : '—'}</span></td>
          <td style="padding:10px 14px;"><span style="font-family:var(--mono); font-size:0.75rem; color:var(--muted);">${m.min_latency_ms || 0}ms / ${m.max_latency_ms || 0}ms</span></td>
          <td style="padding:10px 14px;"><div style="display:flex; align-items:center;">${recentDots || '<span style="font-size:0.7rem; color:var(--muted);">—</span>'}</div></td>
        </tr>
      `;
    }).join('');

    const updEl = document.getElementById('matrix-last-updated');
    if (updEl) updEl.textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (err) {
    console.error('Failed to load latency matrix', err);
  }
}

// ── SEMANTIC CACHE CLIENT ────────────────────────────────
let cachedEntriesList = [];

async function loadCacheStats() {
  try {
    const [statsRes, entriesRes] = await Promise.all([
      apiFetch('/api/v1/cache/stats'),
      apiFetch('/api/v1/cache/entries?limit=100'),
    ]);

    if (statsRes && statsRes.ok) {
      const data = await statsRes.json();
      const st = data.stats || {};
      const hitRateEl = document.getElementById('cache-stat-hit-rate');
      if (hitRateEl) hitRateEl.textContent = (st.hit_rate_percent !== undefined ? st.hit_rate_percent : 0) + '%';
      const hitsEl = document.getElementById('cache-stat-hits');
      if (hitsEl) hitsEl.textContent = st.hits || 0;
      const missesEl = document.getElementById('cache-stat-misses');
      if (missesEl) missesEl.textContent = st.misses || 0;
      const entriesEl = document.getElementById('cache-stat-entries');
      if (entriesEl) entriesEl.textContent = st.entries || 0;
      const activeEl = document.getElementById('cache-stat-active');
      if (activeEl) activeEl.textContent = st.active || 0;
      const expiredEl = document.getElementById('cache-stat-expired');
      if (expiredEl) expiredEl.textContent = st.expired || 0;
      const latencyEl = document.getElementById('cache-stat-latency');
      if (latencyEl) latencyEl.textContent = (st.latency_saved_ms || 0) + ' ms';
      const costEl = document.getElementById('cache-stat-cost');
      if (costEl) costEl.textContent = '$' + (st.cost_saved_usd !== undefined ? Number(st.cost_saved_usd).toFixed(4) : '0.0000');
      const tokensEl = document.getElementById('cache-stat-tokens');
      if (tokensEl) tokensEl.textContent = st.tokens_saved || 0;

      // Update tuning inputs
      const threshSlider = document.getElementById('cache-thresh-slider');
      if (threshSlider && st.threshold !== undefined) {
        threshSlider.value = st.threshold;
        const threshLabel = document.getElementById('cache-thresh-label');
        if (threshLabel) threshLabel.textContent = Number(st.threshold).toFixed(2) + ' (' + Math.round(st.threshold * 100) + '%)';
      }
      const ttlInput = document.getElementById('cache-ttl-input');
      if (ttlInput && st.ttl !== undefined) ttlInput.value = st.ttl;
      const maxsizeInput = document.getElementById('cache-maxsize-input');
      if (maxsizeInput && st.max_size !== undefined) maxsizeInput.value = st.max_size;
    }

    if (entriesRes && entriesRes.ok) {
      const data = await entriesRes.json();
      cachedEntriesList = data.entries || [];
      renderCacheTable(cachedEntriesList);
    }
  } catch (err) {
    console.error('Failed to load semantic cache stats', err);
  }
}

function renderCacheTable(entries) {
  const tbody = document.getElementById('cache-table-body');
  const countEl = document.getElementById('cache-table-count');
  if (countEl) countEl.textContent = `${entries.length} entries`;
  if (!tbody) return;

  if (!entries || entries.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:32px; color:var(--muted);">No cached prompt embeddings found</td></tr>`;
    return;
  }

  tbody.innerHTML = entries.map(e => `
    <tr style="border-bottom:1px solid rgba(255,255,255,0.05); font-size:0.83rem;">
      <td style="padding:10px 14px; font-family:var(--mono); color:var(--cyan);"><span style="background:rgba(0,212,255,0.1); padding:2px 8px; border-radius:6px; font-size:0.75rem;">${escapeHtml(e.model || 'all')}</span></td>
      <td style="padding:10px 14px; color:var(--text); max-width:280px; word-break:break-word;">
        <span title="${escapeHtml(e.prompt)}">${escapeHtml(e.prompt_preview || e.prompt)}</span>
      </td>
      <td style="padding:10px 14px; color:var(--muted2); font-family:var(--mono); font-size:0.78rem; max-width:260px; word-break:break-word;">
        ${escapeHtml(e.response_preview || '—')}
      </td>
      <td style="padding:10px 14px; text-align:center; font-family:var(--mono); color:var(--yellow);">${e.tokens || 0}</td>
      <td style="padding:10px 14px; text-align:center; font-family:var(--mono); color:var(--green);">${e.expires_in_secs}s</td>
      <td style="padding:10px 14px; text-align:right;">
        <button class="btn btn-sm btn-ghost" style="color:var(--red); padding:4px 8px;" onclick="deleteCacheEntry(${JSON.stringify(e.key)})" title="Delete entry">🗑️</button>
      </td>
    </tr>
  `).join('');
}

function filterCacheTable() {
  const query = (document.getElementById('cache-filter-input')?.value || '').toLowerCase().trim();
  if (!query) {
    renderCacheTable(cachedEntriesList);
    return;
  }
  const filtered = cachedEntriesList.filter(e =>
    (e.prompt || '').toLowerCase().includes(query) ||
    (e.model || '').toLowerCase().includes(query) ||
    (e.response_preview || '').toLowerCase().includes(query)
  );
  renderCacheTable(filtered);
}

async function testCacheSimilarity() {
  const prompt = (document.getElementById('cache-test-prompt')?.value || '').trim();
  if (!prompt) {
    toast('Please enter a test query/prompt', 'warning');
    return;
  }
  const model = (document.getElementById('cache-test-model')?.value || '').trim();

  try {
    const res = await apiFetch('/api/v1/cache/test', {
      method: 'POST',
      body: JSON.stringify({ prompt, model: model || undefined })
    });
    if (!res || !res.ok) {
      toast('Failed to test similarity', 'error');
      return;
    }
    const data = await res.json();
    const result = data.result || {};

    const box = document.getElementById('cache-test-result-box');
    if (box) box.style.display = 'block';

    const badge = document.getElementById('cache-test-badge');
    if (badge) {
      if (result.is_hit) {
        badge.textContent = '⚡ CACHE HIT';
        badge.style.background = 'rgba(0,255,157,0.2)';
        badge.style.color = 'var(--green)';
        badge.style.border = '1px solid rgba(0,255,157,0.4)';
      } else {
        badge.textContent = '❌ CACHE MISS';
        badge.style.background = 'rgba(255,59,92,0.2)';
        badge.style.color = 'var(--red)';
        badge.style.border = '1px solid rgba(255,59,92,0.4)';
      }
    }

    const scoreEl = document.getElementById('cache-test-score-text');
    if (scoreEl) scoreEl.textContent = `Score: ${(result.similarity_percent || 0)}% (Cosine Distance: ${result.best_score || 0})`;

    const threshVal = document.getElementById('cache-test-threshold-val');
    if (threshVal) threshVal.textContent = `${result.threshold_percent || 88}%`;

    const matchedPromptEl = document.getElementById('cache-test-matched-prompt');
    if (matchedPromptEl) matchedPromptEl.textContent = result.matched_prompt || '(None)';

    const respWrap = document.getElementById('cache-test-resp-wrap');
    const respPreview = document.getElementById('cache-test-resp-preview');
    if (result.is_hit && result.response_preview) {
      if (respWrap) respWrap.style.display = 'block';
      if (respPreview) respPreview.textContent = result.response_preview;
    } else {
      if (respWrap) respWrap.style.display = 'none';
      if (respPreview) respPreview.textContent = '';
    }
  } catch (err) {
    console.error('Similarity test failed', err);
    toast('Similarity test request failed', 'error');
  }
}

async function saveCacheSettings() {
  const slider = document.getElementById('cache-thresh-slider');
  const ttlInput = document.getElementById('cache-ttl-input');
  const maxsizeInput = document.getElementById('cache-maxsize-input');

  const threshold = slider ? parseFloat(slider.value) : 0.88;
  const ttl = ttlInput ? parseFloat(ttlInput.value) : 3600;
  const max_size = maxsizeInput ? parseInt(maxsizeInput.value, 10) : 500;

  try {
    const res = await apiFetch('/api/v1/cache/config', {
      method: 'POST',
      body: JSON.stringify({ threshold, ttl, max_size })
    });
    if (res && res.ok) {
      toast('Semantic cache settings saved successfully', 'success');
      loadCacheStats();
    } else {
      toast('Failed to save cache settings', 'error');
    }
  } catch (err) {
    console.error('Save cache settings failed', err);
    toast('Error saving cache settings', 'error');
  }
}

async function clearCache() {
  if (!confirm('Are you sure you want to purge all semantic cache entries?')) return;
  try {
    const res = await apiFetch('/api/v1/cache/clear', { method: 'POST' });
    if (res && res.ok) {
      const data = await res.json();
      toast(data.message || 'All cache entries purged', 'success');
      loadCacheStats();
    } else {
      toast('Failed to clear cache', 'error');
    }
  } catch (err) {
    console.error('Clear cache failed', err);
    toast('Error clearing cache', 'error');
  }
}

async function deleteCacheEntry(key) {
  try {
    const res = await apiFetch('/api/v1/cache/entry', {
      method: 'DELETE',
      body: JSON.stringify({ key })
    });
    if (res && res.ok) {
      toast('Cache entry deleted', 'success');
      loadCacheStats();
    } else {
      toast('Failed to delete cache entry', 'error');
    }
  } catch (err) {
    console.error('Delete cache entry failed', err);
    toast('Error deleting entry', 'error');
  }
}

let cachedPromptsList = [];

function renderPromptsList(prompts) {
  const container = document.getElementById('prompts-list-container');
  if (!container) return;

  if (!prompts || prompts.length === 0) {
    container.innerHTML = `<div style="padding:24px; text-align:center; color:var(--muted); font-size:0.88rem; background:rgba(0,0,0,0.25); border-radius:12px; border:1px solid var(--border);">No prompt templates found. Click "+ New Prompt Template" to create one.</div>`;
    return;
  }

  container.innerHTML = prompts.map(p => {
    const vars = p.variables || [];
    const varBadges = vars.map(v => `<span style="font-size:0.72rem; background:rgba(0,212,255,0.12); color:var(--cyan); border:1px solid rgba(0,212,255,0.25); padding:1px 6px; border-radius:6px; font-family:var(--mono);">${'{' + '{' + escapeHtml(v) + '}' + '}'}</span>`).join(' ');

}

function filterPrompts() {
  const query = (document.getElementById('prompt-search-input')?.value || '').toLowerCase().trim();
  if (!query) {
    renderPromptsList(cachedPromptsList);
    return;
  }
  const filtered = cachedPromptsList.filter(p =>
    (p.name || '').toLowerCase().includes(query) ||
    (p.description || '').toLowerCase().includes(query) ||
    (p.template || '').toLowerCase().includes(query)
  );
  renderPromptsList(filtered);
}

function populatePlaygroundSelect(prompts) {
  const select = document.getElementById('pg-prompt-select');
  if (!select) return;
  const currentVal = select.value;
  select.innerHTML = '<option value="">-- Choose a template to test --</option>' +
    prompts.map(p => `<option value="${escapeHtml(p.name)}">${escapeHtml(p.name)} (${escapeHtml(p.version || 'v1')})</option>`).join('');
  if (currentVal && prompts.some(p => p.name === currentVal)) {
    select.value = currentVal;
  }
}

function selectPromptForPlayground(name) {
  const select = document.getElementById('pg-prompt-select');
  if (select) {
    select.value = name;
    onPlaygroundPromptSelected(name);
  }
}

function onPlaygroundPromptSelected(name) {
  const badge = document.getElementById('pg-selected-badge');
  const previewBox = document.getElementById('pg-template-preview');
  const sysPreview = document.getElementById('pg-sys-preview');
  const userPreview = document.getElementById('pg-user-preview');
  const varsSection = document.getElementById('pg-variables-section');
  const varsContainer = document.getElementById('pg-variables-container');
  const modelInput = document.getElementById('pg-model-input');
  const tempInput = document.getElementById('pg-temp-input');
  const outputBox = document.getElementById('pg-output-box');

  if (outputBox) outputBox.style.display = 'none';

  if (!name) {
    if (badge) badge.textContent = 'Select a template';
    if (previewBox) previewBox.style.display = 'none';
    if (varsSection) varsSection.style.display = 'none';
    return;
  }

  const p = cachedPromptsList.find(x => x.name === name);
  if (!p) return;

  if (badge) badge.textContent = `${p.name} (${p.version || 'v1'})`;

  if (previewBox) {
    previewBox.style.display = 'block';
    if (sysPreview) {
      if (p.system_prompt) {
        sysPreview.style.display = 'block';
        sysPreview.textContent = 'System: ' + p.system_prompt;
      } else {
        sysPreview.style.display = 'none';
      }
    }
    if (userPreview) userPreview.textContent = p.template || '';
  }

  // Populate dynamic variable inputs
  const vars = p.variables || [];
  if (varsContainer && varsSection) {
    if (vars.length > 0) {
      varsSection.style.display = 'block';
      varsContainer.innerHTML = vars.map(v => `
        <div style="display:flex; flex-direction:column; gap:4px;">
          <label style="font-size:0.75rem; font-weight:600; color:var(--cyan); font-family:var(--mono);">${escapeHtml(v)}</label>
          <input type="text" class="pg-var-input" data-var="${escapeHtml(v)}" placeholder="Value for ${'{' + '{' + escapeHtml(v) + '}' + '}'}" style="width:100%; margin-bottom:0; background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.12); border-radius:8px; padding:7px 12px; font-size:0.83rem; color:#fff;">
        </div>
      `).join('');
    } else {
      varsSection.style.display = 'none';
      varsContainer.innerHTML = '';
    }
  }

  if (modelInput) modelInput.value = p.model || 'mock/mock-fast';
  if (tempInput) tempInput.value = (p.temperature !== null && p.temperature !== undefined) ? p.temperature : 0.7;
}

async function runPromptPlayground() {
  const select = document.getElementById('pg-prompt-select');
  const name = select ? select.value : '';
  if (!name) {
    toast('Please choose a prompt template first', 'warning');
    return;
  }

  const p = cachedPromptsList.find(x => x.name === name);
  const vars = {};
  document.querySelectorAll('.pg-var-input').forEach(input => {
    const key = input.dataset.var;
    if (key) vars[key] = input.value || '';
  });

  const model = document.getElementById('pg-model-input')?.value.trim() || undefined;
  const tempVal = document.getElementById('pg-temp-input')?.value;
  const temperature = tempVal ? parseFloat(tempVal) : undefined;

  const runBtn = document.getElementById('pg-run-btn');
  if (runBtn) {
    runBtn.disabled = true;
    runBtn.textContent = '⚡ Executing Prompt...';
  }

  try {
    const res = await apiFetch(`/api/v1/prompts/${encodeURIComponent(name)}/run`, {
      method: 'POST',
      body: JSON.stringify({
        version: p ? p.version : undefined,
        variables: vars,
        model: model,
        temperature: temperature,
      })
    });

    if (!res || !res.ok) {
      const errData = res ? await res.json().catch(() => ({})) : {};
      toast(errData.detail || 'Failed to execute prompt in playground', 'error');
      return;
    }

    const data = await res.json();
    const outBox = document.getElementById('pg-output-box');
    if (outBox) outBox.style.display = 'block';

    const outModel = document.getElementById('pg-out-model');
    if (outModel) outModel.textContent = data.model_used || model || 'mock';

    const outLatency = document.getElementById('pg-out-latency');
    if (outLatency) outLatency.textContent = (data.latency_ms !== undefined ? data.latency_ms : 0) + ' ms';

    const outTokens = document.getElementById('pg-out-tokens');
    if (outTokens) outTokens.textContent = (data.tokens || 0) + ' tokens';

    const outCached = document.getElementById('pg-out-cached');
    if (outCached) outCached.style.display = data.cached ? 'inline-block' : 'none';

    const outContent = document.getElementById('pg-out-content');
    if (outContent) outContent.textContent = data.content || '(Empty response)';

    toast('Prompt executed successfully!', 'success');
  } catch (err) {
    console.error('Run prompt error', err);
    toast('Error executing prompt', 'error');
  } finally {
    if (runBtn) {
      runBtn.disabled = false;
      runBtn.textContent = '⚡ Execute Prompt in Playground';
    }
  }
}

function openPromptModal(editName = null) {
  const overlay = document.getElementById('prompt-modal-overlay');
  const title = document.getElementById('prompt-modal-title');
  const nameInput = document.getElementById('prompt-form-name');
  const versionInput = document.getElementById('prompt-form-version');
  const descInput = document.getElementById('prompt-form-desc');
  const sysInput = document.getElementById('prompt-form-sys');
  const tplInput = document.getElementById('prompt-form-template');
  const modelInput = document.getElementById('prompt-form-model');
  const tempInput = document.getElementById('prompt-form-temp');

  if (editName && typeof editName === 'string') {
    const p = cachedPromptsList.find(x => x.name === editName);
    if (p) {
      if (title) title.textContent = 'Edit Prompt Template';
      if (nameInput) { nameInput.value = p.name; nameInput.readOnly = true; }
      if (versionInput) versionInput.value = p.version || 'v2';
      if (descInput) descInput.value = p.description || '';
      if (sysInput) sysInput.value = p.system_prompt || '';
      if (tplInput) tplInput.value = p.template || '';
      if (modelInput) modelInput.value = p.model || '';
      if (tempInput) tempInput.value = p.temperature !== null && p.temperature !== undefined ? p.temperature : 0.7;
      previewPromptVariables();
      if (overlay) overlay.classList.add('open');
      return;
    }
  }

  // New prompt
  if (title) title.textContent = 'New Prompt Template';
  if (nameInput) { nameInput.value = ''; nameInput.readOnly = false; }
  if (versionInput) versionInput.value = 'v1';
  if (descInput) descInput.value = '';
  if (sysInput) sysInput.value = '';
  if (tplInput) tplInput.value = '';
  if (modelInput) modelInput.value = '';
  if (tempInput) tempInput.value = '0.7';
  previewPromptVariables();
  if (overlay) overlay.classList.add('open');
}

function editPromptTemplate(name) {
  openPromptModal(name);
}

function closePromptModal() {
  const overlay = document.getElementById('prompt-modal-overlay');
  if (overlay) overlay.classList.remove('open');
}

function previewPromptVariables() {
  const sysText = document.getElementById('prompt-form-sys')?.value || '';
  const tplText = document.getElementById('prompt-form-template')?.value || '';
  const fullText = sysText + ' ' + tplText;
  const matches = fullText.match(/\{\{\s*([a-zA-Z0-9_-]+)\s*\}\}/g) || [];
  const uniqueVars = Array.from(new Set(matches.map(m => m.replace(/[{}]/g, '').trim()))).filter(Boolean);

  const container = document.getElementById('prompt-form-detected-vars');
  if (!container) return;
  if (uniqueVars.length === 0) {
    container.innerHTML = '<span style="font-size:0.75rem; color:var(--muted); font-style:italic;">None</span>';
  } else {
    container.innerHTML = uniqueVars.map(v =>
      `<span style="font-size:0.75rem; background:rgba(0,212,255,0.15); color:var(--cyan); border:1px solid rgba(0,212,255,0.3); padding:2px 8px; border-radius:6px; font-family:var(--mono);">${'{' + '{' + escapeHtml(v) + '}' + '}'}</span>`
    ).join(' ');
  }
}

async function savePromptTemplate(e) {
  if (e && e.preventDefault) e.preventDefault();
  const name = document.getElementById('prompt-form-name')?.value.trim();
  const version = document.getElementById('prompt-form-version')?.value.trim() || 'v1';
  const description = document.getElementById('prompt-form-desc')?.value.trim() || '';
  const system_prompt = document.getElementById('prompt-form-sys')?.value || '';
  const template = document.getElementById('prompt-form-template')?.value || '';
  const model = document.getElementById('prompt-form-model')?.value.trim() || undefined;
  const tempVal = document.getElementById('prompt-form-temp')?.value;
  const temperature = tempVal ? parseFloat(tempVal) : undefined;

  if (!name || !template) {
    toast('Prompt name and template body are required', 'warning');
    return;
  }

  try {
    const res = await apiFetch('/api/v1/prompts', {
      method: 'POST',
      body: JSON.stringify({
        name,
        version,
        description,
        system_prompt,
        template,
        model,
        temperature
      })
    });

    if (res && res.ok) {
      toast(`Prompt '${name}' (${version}) saved successfully!`, 'success');
      closePromptModal();
      loadPrompts();
    } else {
      const err = res ? await res.json().catch(() => ({})) : {};
      toast(err.detail || 'Failed to save prompt template', 'error');
    }
  } catch (err) {
    console.error('Save prompt template error', err);
    toast('Error saving prompt template', 'error');
  }
}

async function deletePromptTemplate(name) {
  if (!confirm(`Are you sure you want to delete prompt template '${name}' and all its versions?`)) return;
  try {
    const res = await apiFetch(`/api/v1/prompts/${encodeURIComponent(name)}`, { method: 'DELETE' });
    if (res && res.ok) {
      toast(`Prompt '${name}' deleted successfully`, 'success');
      loadPrompts();
    } else {
      toast('Failed to delete prompt template', 'error');
    }
  } catch (err) {
    console.error('Delete prompt template error', err);
    toast('Error deleting prompt template', 'error');
  }
}

// ── TOKEN-SAVIOUR CONTEXT OPTIMIZER & CAVEMAN TERSE ─────────
async function runTokenSaviour(mode = 'standard') {
  const promptEl = document.getElementById('c-prompt');
  const badgeEl = document.getElementById('c-prompt-optimizer-badge');
  if (!promptEl || !promptEl.value.trim()) {
    toast('Please enter some text, code, or terminal output in the prompt box first', 'warning');
    return;
  }
  const original = promptEl.value;
  const isSkeletonize = mode === 'skeletonize' || mode === true;
  const isTerse = mode === 'terse';

  try {
    const r = await apiFetch('/api/v1/context/optimize', {
      method: 'POST',
      body: JSON.stringify({
        text: original,
        skeletonize: isSkeletonize,
        terse: isTerse,
        trim_terminal: true,
        normalize_ws: true
      })
    });
    if (r && r.ok) {
      const d = await r.json();
      promptEl.value = d.optimized_text || d.text || '';
      const stats = d.stats || {};
      const savingsPct = stats.savings_pct !== undefined ? stats.savings_pct.toFixed(1) : (d.reduction_pct || 0);
      const origTok = stats.original_tokens !== undefined ? stats.original_tokens : (d.original_chars || 0);
      const optTok = stats.optimized_tokens !== undefined ? stats.optimized_tokens : (d.optimized_chars || 0);
      if (badgeEl) {
        badgeEl.style.display = 'inline-flex';
        badgeEl.className = 'provider-badge';
        if (isTerse) {
          badgeEl.style.background = 'rgba(245, 158, 11, 0.15)';
          badgeEl.style.color = '#f59e0b';
          badgeEl.style.border = '1px solid rgba(245, 158, 11, 0.3)';
          badgeEl.innerHTML = `🗿 Caveman Saved ${savingsPct}% (${origTok} → ${optTok} tokens) [Terse Mode]`;
        } else if (isSkeletonize) {
          badgeEl.style.background = 'rgba(192, 132, 252, 0.15)';
          badgeEl.style.color = '#c084fc';
          badgeEl.style.border = '1px solid rgba(192, 132, 252, 0.3)';
          badgeEl.innerHTML = `🦴 Saved ${savingsPct}% (${origTok} → ${optTok} tokens) [AST Skeletonized]`;
        } else {
          badgeEl.style.background = 'rgba(0, 212, 255, 0.15)';
          badgeEl.style.color = 'var(--cyan)';
          badgeEl.style.border = '1px solid rgba(0, 212, 255, 0.3)';
          badgeEl.innerHTML = `✂️ Saved ${savingsPct}% (${origTok} → ${optTok} tokens) [Token-Saviour Trim]`;
        }
      }
      toast(`Token-Saviour reduced context by ${savingsPct}%`, 'success');
    } else {
      toast('Failed to optimize context', 'error');
    }
  } catch (e) {
    console.error('Token-Saviour error', e);
    toast('Error running context optimizer', 'error');
  }
}

// ── PROMPT TASK SIZING HOOK ────────────────────────────────
async function runTaskSizing() {
  const promptEl = document.getElementById('c-prompt');
  const badgeEl = document.getElementById('c-sizer-result-badge');
  if (!promptEl || !promptEl.value.trim()) {
    toast('Please enter prompt text first', 'warning');
    return;
  }
  try {
    const r = await apiFetch('/api/v1/prompt/size-hook', {
      method: 'POST',
      body: JSON.stringify({ prompt: promptEl.value })
    });
    if (r && r.ok) {
      const d = await r.json();
      const model = d.model_override || d.recommended_model || 'claude-3-5-sonnet';
      const tier = d.tier || 'M';
      const rationale = d.rationale || '';
      const signals = (d.metadata && d.metadata.signals) ? d.metadata.signals.join(', ') : (Array.isArray(d.reasons) ? d.reasons.join(', ') : '');
      const detail = signals ? `[${signals}]` : rationale;

      if (badgeEl) {
        badgeEl.style.display = 'inline-flex';
        const tierColors = {
          'XS': '#10b981',
          'S': '#00d4ff',
          'M': '#f59e0b',
          'L': '#ec4899'
        };
        const col = tierColors[tier] || '#7c6fff';
        badgeEl.className = 'provider-badge';
        badgeEl.style.background = `${col}22`;
        badgeEl.style.color = col;
        badgeEl.style.border = `1px solid ${col}55`;
        badgeEl.innerHTML = `📏 Tier: <strong>${escapeHtml(tier)}</strong> → Model: <strong>${escapeHtml(model)}</strong> ${detail ? `<span style="font-size:0.75rem; color:var(--muted2); font-weight:normal;">(${escapeHtml(detail)})</span>` : ''}`;
      }
      toast(`Prompt Sizer: Classified as Tier ${tier} → ${model}`, 'info');
    } else {
      toast('Failed to size prompt', 'error');
    }
  } catch (e) {
    console.error('Prompt Sizer error', e);
    toast('Error calculating task sizing', 'error');
  }
}

// ── SENTINEL CIRCUIT BREAKERS ──────────────────────────────
async function loadCircuitBreakerStatus() {
  const tbody = document.getElementById('cb-table-body');
  if (!tbody) return;
  try {
    const r = await apiFetch('/api/v1/circuit_breaker/status');
    if (!r || !r.ok) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:16px; color:var(--muted);">Failed to load circuit breaker status</td></tr>';
      return;
    }
    const data = await r.json();
    const providers = Object.keys(data);
    if (!providers.length) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:16px; color:var(--muted);">No providers registered in circuit breaker registry</td></tr>';
      return;
    }

    let rowsHtml = '';
    for (const p of providers) {
      const pInfo = data[p];
      const keys = pInfo.keys || [];
      if (!keys.length) {
        rowsHtml += `
          <tr style="border-bottom:1px solid var(--border);">
            <td style="padding:10px 14px; font-weight:600;">${escapeHtml(p)}</td>
            <td style="padding:10px 14px; color:var(--muted); font-family:var(--mono);">—</td>
            <td style="padding:10px 14px;"><span class="provider-badge badge-warning">No Keys</span></td>
            <td style="padding:10px 14px; font-family:var(--mono);">${escapeHtml(pInfo.provider_circuit_state || 'closed')}</td>
            <td style="padding:10px 14px; font-family:var(--mono);">0%</td>
            <td style="padding:10px 14px; font-family:var(--mono);">0</td>
            <td style="padding:10px 14px; font-family:var(--mono);">0s</td>
            <td style="padding:10px 14px; text-align:right;">
              <button class="btn btn-sm btn-ghost" onclick="resetAllCircuitBreakers('${escapeHtml(p)}')">Reset</button>
            </td>
          </tr>
        `;
      } else {
        for (const k of keys) {
          const cState = (k.circuit_state || 'closed').toLowerCase();
          let cBadge = '';
          if (cState === 'open' || k.status === 'circuit_broken') {
            cBadge = '<span class="provider-badge" style="background:rgba(239,68,68,0.2); color:#f87171; border:1px solid rgba(239,68,68,0.4);">🔴 Open</span>';
          } else if (cState === 'half_open') {
            cBadge = '<span class="provider-badge" style="background:rgba(234,179,8,0.2); color:#facc15; border:1px solid rgba(234,179,8,0.4);">🟡 Half-Open</span>';
          } else {
            cBadge = '<span class="provider-badge" style="background:rgba(0,255,157,0.12); color:var(--green); border:1px solid rgba(0,255,157,0.25);">🟢 Closed</span>';
          }

          const kStatus = (k.status || 'active').toLowerCase();
          const sBadge = kStatus === 'active' ? '<span class="provider-badge badge-active">Active</span>' :
                         kStatus === 'rate_limited' ? '<span class="provider-badge badge-warning">Rate Limited</span>' :
                         kStatus === 'circuit_broken' ? '<span class="provider-badge badge-error">Tripped</span>' :
                         `<span class="provider-badge badge-warning">${escapeHtml(k.status)}</span>`;

          const failRatePct = Math.round((k.recent_failure_rate || 0) * 100);
          const cdRemaining = k.cooldown_remaining_secs > 0 ? `${k.cooldown_remaining_secs}s` : '—';

          rowsHtml += `
            <tr style="border-bottom:1px solid var(--border);">
              <td style="padding:10px 14px; font-weight:600;">${escapeHtml(p)}</td>
              <td style="padding:10px 14px; font-family:var(--mono); color:var(--cyan);">${escapeHtml(k.key_hint || '***')}</td>
              <td style="padding:10px 14px;">${sBadge}</td>
              <td style="padding:10px 14px;">${cBadge}</td>
              <td style="padding:10px 14px; font-family:var(--mono); color:${failRatePct > 50 ? '#ef4444' : 'inherit'};">${failRatePct}%</td>
              <td style="padding:10px 14px; font-family:var(--mono);">${k.circuit_trips || 0}</td>
              <td style="padding:10px 14px; font-family:var(--mono); color:${k.cooldown_remaining_secs > 0 ? '#facc15' : 'var(--muted)'};">${cdRemaining}</td>
              <td style="padding:10px 14px; text-align:right;">
                <button class="btn btn-sm btn-ghost" onclick="resetAllCircuitBreakers('${escapeHtml(p)}')">Reset</button>
              </td>
            </tr>
          `;
        }
      }
    }
    tbody.innerHTML = rowsHtml;
    const lastChecked = document.getElementById('cb-last-checked');
    if (lastChecked) {
      lastChecked.textContent = 'Updated ' + new Date().toLocaleTimeString();
    }
  } catch (e) {
    console.error('Failed to load circuit breaker status', e);
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:16px; color:#ef4444;">Error fetching circuit breakers</td></tr>';
  }
}

async function resetAllCircuitBreakers(arg = null) {
  let provider = null;
  let btn = null;
  if (typeof arg === 'string' && arg.trim()) {
    provider = arg.trim();
  } else if (arg && typeof arg === 'object' && 'disabled' in arg) {
    btn = arg;
  }
  const origText = btn ? btn.innerHTML : '';
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = 'Resetting...';
  }
  try {
    const url = '/api/v1/circuit_breaker/reset' + (provider ? `?provider=${encodeURIComponent(provider)}` : '');
    const r = await apiFetch(url, { method: 'POST' });
    if (r && r.ok) {
      const d = await r.json();
      toast(`Reset ${d.reset_keys || 0} circuit broken keys for ${d.provider || 'all'}`, 'success');
      await loadCircuitBreakerStatus();
      await refreshDashboard();
    } else {
      toast('Failed to reset circuit breakers', 'error');
    }
  } catch (e) {
    console.error('Circuit breaker reset error', e);
    toast('Error resetting circuit breakers', 'error');
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = origText || '🔄 Reset Keys';
    }
  }
}

function closeQuickstartModal() {
  const modal = document.getElementById('quickstart-modal');

}

function switchQuickstartTab(tabKey) {
  currentQuickstartTab = tabKey;
  const tabBtns = document.querySelectorAll('.qs-tab-btn, .quickstart-tab-btn');
  tabBtns.forEach(b => {
    const isTarget = b.id === `qs-tab-${tabKey}`;
    b.classList.toggle('active', isTarget);
    if (isTarget) {
      b.classList.remove('btn-ghost');
      b.style.borderColor = 'var(--cyan)';
      b.style.color = '#fff';
      b.style.background = 'rgba(0, 212, 255, 0.15)';
    } else {
      b.classList.add('btn-ghost');
      b.style.borderColor = 'var(--border)';
      b.style.color = 'var(--muted)';
      b.style.background = 'transparent';
    }
  });

  const codeEl = document.getElementById('qs-code-block');
  if (codeEl) {
    const snippets = quickstartData && quickstartData.snippets ? quickstartData.snippets : {};
    let code = '';
    if (tabKey === 'openai') code = snippets.openai_python || '// Loading OpenAI snippet...';
    else if (tabKey === 'anthropic') code = snippets.anthropic_python || '// Loading Anthropic snippet...';
    else if (tabKey === 'curl') code = snippets.curl || '// Loading cURL snippet...';
    else if (tabKey === 'claude') code = snippets.claude_code || '// Loading Claude Code snippet...';
    codeEl.textContent = code;
  }

  const hostEl = document.getElementById('qs-host-display');
  if (hostEl && quickstartData && quickstartData.base_url) {
    hostEl.textContent = quickstartData.base_url;
  }
}

function copyQuickstartSnippet() {

  if (!codeEl || !codeEl.textContent) return;
  copyToClipboard(codeEl.textContent, 'Snippet copied to clipboard!');

async function loadShadowConfig() {
  try {
    const [cfgRes, histRes] = await Promise.all([
      apiFetch('/api/v1/router/shadow'),
      apiFetch('/api/v1/router/shadow/history')
    ]);
    if (cfgRes && cfgRes.ok) {
      const cfg = await cfgRes.json();
      const primEl = document.getElementById('shadow-primary-model');
      const targEl = document.getElementById('shadow-target-model');
      const rateEl = document.getElementById('shadow-sample-rate');
      const pill = document.getElementById('shadow-status-pill');
      if (primEl) primEl.value = cfg.primary_model || '';
      if (targEl) targEl.value = cfg.shadow_model || '';
      if (rateEl && cfg.sample_rate !== undefined) rateEl.value = cfg.sample_rate;
      if (pill) {
        pill.innerHTML = cfg.enabled
          ? `<span style="color:var(--green);">Active: ${cfg.sample_rate}% → ${escapeHtml(cfg.shadow_model)}</span>`
          : 'Inactive';
      }
    }
    if (histRes && histRes.ok) {
      const hist = await histRes.json();
      const items = hist.history || [];
      const tbody = document.getElementById('shadow-history-tbody');
      if (tbody) {
        if (!items.length) {
          tbody.innerHTML = '<tr><td colspan="5" style="padding:12px; text-align:center; color:var(--muted);">No shadow executions recorded yet.</td></tr>';
        } else {
          tbody.innerHTML = items.map(it => {
            const ts = it.timestamp ? new Date(it.timestamp * 1000).toLocaleTimeString() : '—';
            const stBadge = it.status === 'success'
              ? '<span style="color:var(--green); font-weight:600;">✓ Success</span>'
              : `<span style="color:var(--red); font-weight:600;">✕ ${escapeHtml(it.status || 'Error')}</span>`;
            return `<tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
              <td style="padding:7px 10px; font-family:var(--mono); color:var(--muted);">${ts}</td>
              <td style="padding:7px 10px; font-family:var(--mono);">${escapeHtml(it.primary_model || '*')}</td>
              <td style="padding:7px 10px; font-family:var(--mono); color:var(--cyan);">${escapeHtml(it.shadow_model || '')}</td>
              <td style="padding:7px 10px; font-family:var(--mono);">${it.latency_ms || 0}ms</td>
              <td style="padding:7px 10px;">${stBadge}</td>

async function loadRouterTopology() {
  const container = document.getElementById('router-topology-container');
  if (!container) return;
  try {
    const r = await apiFetch('/api/v1/router/topology');
    if (!r || !r.ok) return;
    const d = await r.json();
    const provNodes = (d.providers || []).map(p => {
      const col = p.healthy ? 'var(--green)' : 'var(--red)';
      return `<span style="padding:4px 10px; border-radius:6px; background:rgba(255,255,255,0.05); border:1px solid ${col}; font-family:var(--mono); font-size:0.76rem; color:var(--text);">🏢 ${escapeHtml(p.name)} <span style="color:${col};">(${p.active_keys}/${p.total_keys} keys)</span></span>`;
    }).join(' ');
    const aliasHtml = Object.entries(d.aliases || {}).map(([k, v]) =>
      `<span style="font-family:var(--mono); font-size:0.75rem; background:rgba(0,212,255,0.1); border:1px solid rgba(0,212,255,0.28); padding:2px 8px; border-radius:6px; color:var(--cyan);">🏷️ ${escapeHtml(k)} → ${escapeHtml(v)}</span>`
    ).join(' ');
    const groupHtml = (d.groups || []).map(g =>
      `<span style="font-family:var(--mono); font-size:0.75rem; background:rgba(124,111,255,0.12); border:1px solid rgba(124,111,255,0.3); padding:2px 8px; border-radius:6px; color:#c084fc;">📌 ${escapeHtml(g.id)} → [${(g.models || []).map(escapeHtml).join(', ')}]</span>`
    ).join(' ');
    const canaryBadge = d.canary && d.canary.enabled
      ? `<span style="color:var(--green); font-family:var(--mono); font-size:0.76rem;">🔀 Canary: ${escapeHtml(d.canary.primary_model || '*')} → ${d.canary.weight}% ${escapeHtml(d.canary.canary_model)}</span>`
      : `<span style="color:var(--muted); font-size:0.76rem;">🔀 Canary: Off</span>`;
    const shadowBadge = d.shadow && d.shadow.enabled
      ? `<span style="color:var(--cyan); font-family:var(--mono); font-size:0.76rem;">👤 Shadow: ${escapeHtml(d.shadow.primary_model || '*')} → ${d.shadow.sample_rate}% ${escapeHtml(d.shadow.shadow_model)}</span>`
      : `<span style="color:var(--muted); font-size:0.76rem;">👤 Shadow: Off</span>`;

    container.innerHTML = `
      <div style="display:flex; flex-direction:column; gap:10px;">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; padding-bottom:8px; border-bottom:1px solid rgba(255,255,255,0.06);">
          <span style="font-size:0.8rem; font-weight:700; color:var(--text);">Client Request ➔ Strategy: <code style="color:var(--cyan);">${escapeHtml((d.strategy || 'priority').toUpperCase())}</code></span>
          <div style="display:flex; gap:14px; flex-wrap:wrap;">${canaryBadge} ${shadowBadge}</div>
        </div>
        <div><div style="font-size:0.72rem; color:var(--muted); margin-bottom:5px; text-transform:uppercase;">Active Upstream Providers</div><div style="display:flex; gap:8px; flex-wrap:wrap;">${provNodes || '<span style="color:var(--muted); font-size:0.78rem;">No providers configured</span>'}</div></div>
        ${aliasHtml ? `<div><div style="font-size:0.72rem; color:var(--muted); margin-bottom:5px; text-transform:uppercase;">Model Aliases</div><div style="display:flex; gap:8px; flex-wrap:wrap;">${aliasHtml}</div></div>` : ''}
        ${groupHtml ? `<div><div style="font-size:0.72rem; color:var(--muted); margin-bottom:5px; text-transform:uppercase;">Dynamic Failover Groups</div><div style="display:flex; gap:8px; flex-wrap:wrap;">${groupHtml}</div></div>` : ''}
      </div>
    `;
  } catch (e) {
    container.innerHTML = '<div style="color:var(--muted);">Could not render topology graph.</div>';
  }
}

      })
    });
    if (r && r.ok) {
      const d = await r.json();
      if (box) {
        box.style.display = 'block';
        const col = d.score >= 80 ? 'var(--green)' : (d.score >= 60 ? '#fbbf24' : 'var(--red)');
        const sugg = (d.suggestions || []).length
          ? `<ul style="margin:6px 0 0 18px; color:var(--muted);">${d.suggestions.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ul>`
          : '<div style="color:var(--green); margin-top:4px;">✓ Enterprise-ready prompt structure!</div>';
        box.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-weight:700; color:var(--text);">🔍 Prompt Quality Grade: <span style="color:${col}; font-size:0.9rem;">${escapeHtml(d.grade)} (${d.score}/100)</span></span>
            <span style="font-family:var(--mono); font-size:0.74rem; color:var(--cyan);">~${d.estimated_tokens || 0} tokens · ${(d.variables || []).length} vars</span>
          </div>
          ${sugg}
        `;
      }
      toast(`Prompt '${name}' scored ${d.score}/100 (Grade ${d.grade})`, 'info');
    }
  } catch (e) {
    toast('Failed to audit prompt', 'error');
  }
}

async function exportPlaygroundIdeRules() {
  const name = document.getElementById('pg-prompt-select')?.value;
  if (!name) {
    toast('Select a prompt template first to export IDE rules', 'warning');
    return;
  }
  try {
    const r = await apiFetch(`/api/v1/prompts/${encodeURIComponent(name)}/export?format=agents`);
    if (r && r.ok) {
      const d = await r.json();
      const content = d.files ? (d.files['AGENTS.md'] || d.content || '') : (d.content || '');
      copyToClipboard(content, `Copied '${name}' as portable AGENTS.md / .cursorrules!`);
      const outBox = document.getElementById('pg-output-box');
      if (outBox) outBox.style.display = 'block';
      const outModel = document.getElementById('pg-out-model');
      if (outModel) outModel.textContent = 'AGENTS.md Export';
      const outContent = document.getElementById('pg-out-content');
      if (outContent) outContent.textContent = content;
    } else {
      toast('Failed to export IDE rules', 'error');
    }
  } catch (e) {
    toast('Error exporting IDE rules', 'error');
  }
}

// ── ANALYTICS LIVE TRACES, OTEL EXPORT & WEBHOOK CENTER ─────
async function loadRequestTraces() {
  const tbody = document.getElementById('an-traces-tbody');
  if (!tbody) return;
  try {
    const r = await apiFetch('/api/v1/traces?limit=40');
    if (!r || !r.ok) return;
    const d = await r.json();
    const traces = d.traces || [];
    if (!traces.length) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:14px; color:var(--muted);">No live request spans captured yet. Run a request in Test Console!</td></tr>';
      return;
    }
    tbody.innerHTML = traces.map(t => {
      const ts = t.timestamp ? new Date(t.timestamp * 1000).toLocaleTimeString() : '—';
      const st = t.status === 'ok' || t.status === 'success'
        ? '<span style="color:var(--green); font-weight:600;">✓ 200 OK</span>'
        : `<span style="color:var(--red); font-weight:600;">✕ ${escapeHtml(t.error || t.status || 'ERR')}</span>`;
      const totTok = (t.prompt_tokens || 0) + (t.completion_tokens || 0);
      return `<tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
        <td style="padding:7px 10px; font-family:var(--mono); color:var(--muted);">${ts}</td>
        <td style="padding:7px 10px; font-weight:600; text-transform:uppercase;">${escapeHtml(t.provider || '—')}</td>
        <td style="padding:7px 10px; font-family:var(--mono); color:var(--cyan);">${escapeHtml(t.model || '—')}</td>
        <td style="padding:7px 10px; font-family:var(--mono);">${Math.round(t.latency_ms || 0)}ms</td>
        <td style="padding:7px 10px; font-family:var(--mono); color:var(--green);">${t.tokens_per_sec || 0} tok/s</td>
        <td style="padding:7px 10px; font-family:var(--mono);">${totTok}</td>
        <td style="padding:7px 10px;">${st}</td>
      </tr>`;
    }).join('');
  } catch (e) {}
}

async function exportOtelTraces() {
  try {
    const r = await apiFetch('/api/v1/traces/otel?limit=50');
    if (!r || !r.ok) {
      toast('Failed to generate OpenTelemetry export', 'error');
      return;
    }
    const d = await r.json();
    const jsonStr = JSON.stringify(d, null, 2);
    const blob = new Blob([jsonStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `veloroute-otel-traces-${Date.now()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    toast('Downloaded OpenTelemetry OTLP JSON spans!', 'success');
  } catch (e) {
    toast('Error exporting OpenTelemetry JSON', 'error');
  }
}

async function loadWebhookCenter() {
  const tbody = document.getElementById('an-webhooks-tbody');
  try {
    const r = await apiFetch('/api/v1/webhooks/status');
    if (!r || !r.ok) return;
    const d = await r.json();
    const urlInp = document.getElementById('wh-config-url');
    if (urlInp && d.webhook_url) urlInp.value = d.webhook_url;
    const hist = d.history || [];
    if (tbody) {
      if (!hist.length) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:12px; color:var(--muted);">No webhook dispatches recorded yet.</td></tr>';
      } else {
        tbody.innerHTML = hist.map(h => {
          const ts = h.timestamp ? new Date(h.timestamp * 1000).toLocaleTimeString() : '—';
          const okBadge = h.delivered || h.status === 'dry_run_ok' || (h.status_code >= 200 && h.status_code < 300)
            ? `<span style="color:var(--green); font-weight:600;">✓ ${escapeHtml(String(h.status_code || h.status || 'OK'))}</span>`
            : `<span style="color:var(--red); font-weight:600;">✕ ${escapeHtml(String(h.error || h.status_code || 'Failed'))}</span>`;
          return `<tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
            <td style="padding:7px 10px; font-family:var(--mono); color:var(--muted);">${ts}</td>
            <td style="padding:7px 10px; font-family:var(--mono); color:var(--cyan);">${escapeHtml(h.event_type || 'ping')}</td>
            <td style="padding:7px 10px; font-family:var(--mono);">${escapeHtml(h.target_url || 'dry-run')}</td>
            <td style="padding:7px 10px;">${okBadge}</td>
          </tr>`;
        }).join('');
      }
    }
  } catch (e) {}
}

async function saveWebhookConfig() {
  const url = document.getElementById('wh-config-url')?.value.trim() || '';
  const secret = document.getElementById('wh-config-secret')?.value.trim() || '';
  const r = await apiFetch('/api/v1/webhooks/config', {
    method: 'POST',
    body: JSON.stringify({ url: url || null, secret: secret || null })
  });
  if (r && r.ok) {
    toast(url ? 'Webhook configuration saved!' : 'Webhook endpoint cleared', 'success');
    await loadWebhookCenter();
  } else {
    const err = r ? await r.json().catch(() => ({})) : {};
    toast(err.detail || 'Invalid webhook URL (SSRF blocked)', 'error');
  }
}

async function testWebhookDelivery() {
  const url = document.getElementById('wh-config-url')?.value.trim() || null;
  const r = await apiFetch('/api/v1/webhooks/test', {
    method: 'POST',
    body: JSON.stringify({ url: url, event_type: 'gateway.test_ping' })
  });
  if (r && r.ok) {
    const d = await r.json();
    toast(d.dry_run ? 'Webhook dry-run HMAC payload signed & logged!' : 'Test webhook ping dispatched!', 'success');
    await loadWebhookCenter();
  } else {
    const err = r ? await r.json().catch(() => ({})) : {};
    toast(err.detail || 'Webhook test failed', 'error');
  }
}

async function clearWebhookHistory() {
  const r = await apiFetch('/api/v1/webhooks/history/clear', { method: 'POST' });
  if (r && r.ok) {
    toast('Webhook delivery history cleared', 'info');
    await loadWebhookCenter();
  }
}

// ── SLASH DIRECTIVES & EMPIRICAL QUALITY FEEDBACK ───────────
function insertSlashCommand(cmd) {
  const el = document.getElementById('c-prompt');
  if (!el) return;
  const cur = el.value.trimStart();
  const stripped = cur.replace(/^\/(fast|cheap|smart|reason|hedge|kv|quality|terse)\s*/i, '');
  el.value = `${cmd} ${stripped}`;
  el.focus();
  toast(`Inserted ${cmd} routing directive`, 'info');
}

async function submitModelFeedback(model, rating, btn) {
  if (!model) return;
  try {
    const r = await apiFetch('/api/v1/feedback', {
      method: 'POST',
      body: JSON.stringify({ model: model, rating: rating })
    });
    if (r && r.ok) {
      const d = await r.json();
      if (btn) {
        btn.style.borderColor = rating > 0 ? 'var(--green)' : 'var(--red)';
        btn.style.color = rating > 0 ? 'var(--green)' : 'var(--red)';
      }
      toast(`Quality score updated for ${model}: ${(d.quality_score * 100).toFixed(0)}%`, 'success');
    }
  } catch (e) {
    toast('Failed to record model feedback', 'error');
  }
}
