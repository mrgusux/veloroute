name: 🐛 Bug Report
description: Report an issue or unexpected behavior in VeloRoute
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue! Please describe the problem and provide reproduction steps.
  - type: input
    id: version
    attributes:
      label: VeloRoute Version / Commit
      placeholder: e.g. v0.3.0 or commit hash
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      placeholder: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Start VeloRoute with '...'
        2. Send request to '/v1/chat/completions'
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Stack Trace
      render: shell
