# Default values for veloroute.
replicaCount: 1

image:
  repository: ghcr.io/mrgusux/veloroute
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: veloroute.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 5Gi
  mountPath: /data
  # storageClassName: ""

env:
  VELOROUTE_UI_HOST: "0.0.0.0"
  VELOROUTE_UI_PORT: "8000"
  VELOROUTE_STORAGE_BACKEND: "sqlite"
  VELOROUTE_STORAGE_URL: "sqlite+aiosqlite:////data/veloroute.db"

# Optional secret credentials for provider routing
secretEnv:
  # OPENAI_API_KEY: ""
  # ANTHROPIC_API_KEY: ""
  # GEMINI_API_KEY: ""
  # GROQ_API_KEY: ""
  # DEEPSEEK_API_KEY: ""

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 2

nodeSelector: {}
tolerations: []
affinity: {}
