[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veloroute"
version = "1.0.0"
description = "Enterprise Universal AI Gateway, High-Availability LLM Routing & Token-Saviour Optimization Engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Mr. Gusu", email = "monirmdmunna123@gmail.com" }
]
keywords = [
    "ai-gateway", "llm-router", "openai", "anthropic", "gemini",
    "prompt-cache", "kv-affinity", "circuit-breaker", "mcp", "fastapi", "python"
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0"
]

[project.optional-dependencies]
all = [
    "aiomysql>=0.2",
    "asyncpg>=0.30",
    "motor>=3.3",
    "redis>=5.0",
]

[project.urls]
Homepage = "https://github.com/mrgusux/veloroute"
Documentation = "https://github.com/mrgusux/veloroute#readme"
Repository = "https://github.com/mrgusux/veloroute.git"
Issues = "https://github.com/mrgusux/veloroute/issues"

[project.scripts]
veloroute = "veloroute.cli:main"

[tool.setuptools.packages.find]
include = ["veloroute*"]

[tool.setuptools.package-data]
"*" = ["*.html", "*.js", "*.css", "*.json", "*.svg", "*.png", "*.ico"]
